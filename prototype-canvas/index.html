function ctxItem(label, val){
  if(!val || !val.trim()) return "";
  return `<div class="ctx-item"><b>${esc(label)}:</b> <span>${esc(val)}</span></div>`;
}

function renderTree(){
  const t = document.getElementById("tree");
  const root = state.nodes[state.rootId];
  let html = nodeCard(root, "root");
  html += `<div class="tier-label">Nodes <span class="tier-hint">· drag to reorder</span></div>`;
  state.order.forEach(id=>{
    const n = state.nodes[id];
    html += `<div class="node-group">`;
    html += nodeCard(n, "", "root");
    if(n.children.length){
      html += `<div class="node-kids">`;
      n.children.forEach(cid=> html += nodeCard(state.nodes[cid], "child", id));
      html += `</div>`;
    }
    html += `<button class="add-node child-add" data-parent="${id}">＋ add sub-question</button>`;
    html += `</div>`;
  });
  html += `<button class="add-node add-top" data-parent="root">＋ add a top-level node</button>`;
  t.innerHTML = html;

  t.querySelectorAll(".node").forEach(el=>{
    if(el.dataset.id === state.rootId) return;
    el.onclick = ()=>{state.selected = el.dataset.id; render();};
  });
  t.querySelectorAll(".add-node").forEach(el=>{
    el.onclick = ()=>addNode(el.dataset.parent);
  });

  // drag to reorder (within the same parent list)
  t.querySelectorAll('.node[draggable="true"]').forEach(el=>{
    el.addEventListener("dragstart", ev=>{
      dragId = el.dataset.id; dragParent = el.dataset.parent;
      el.classList.add("dragging"); ev.dataTransfer.effectAllowed = "move";
      try{ ev.dataTransfer.setData("text/plain", dragId); }catch(e){}
    });
    el.addEventListener("dragend", ()=>{
      el.classList.remove("dragging");
      t.querySelectorAll(".drop-before,.drop-after").forEach(x=>x.classList.remove("drop-before","drop-after"));
      dragId = null;
    });
    el.addEventListener("dragover", ev=>{
      if(!dragId || el.dataset.id===dragId || el.dataset.parent!==dragParent) return;
      ev.preventDefault();
      const r = el.getBoundingClientRect();
      dropBefore = ev.clientY < r.top + r.height/2;
      el.classList.toggle("drop-before", dropBefore);
      el.classList.toggle("drop-after", !dropBefore);
    });
    el.addEventListener("dragleave", ()=> el.classList.remove("drop-before","drop-after"));
    el.addEventListener("drop", ev=>{
      if(!dragId || el.dataset.id===dragId || el.dataset.parent!==dragParent) return;
      ev.preventDefault();
      el.classList.remove("drop-before","drop-after");
      moveNode(dragParent, dragId, el.dataset.id, dropBefore);
    });
  });
}

let dragId = null, dragParent = null, dropBefore = true;
function moveNode(parent, id, targetId, before){
  const list = parent==="root" ? state.order : (state.nodes[parent] ? state.nodes[parent].children : null);
  if(!list) return;
  const from = list.indexOf(id); if(from<0) return;
  list.splice(from, 1);
  let to = list.indexOf(targetId);
  if(to<0){ list.splice(from, 0, id); return; }
  if(!before) to += 1;
  list.splice(to, 0, id);
  const e = state.engagements[state.activeId]; if(e) e.updatedAt = Date.now();
  toast("Reordered");
  render();
}

// Ownership, consolidated: one badge instead of provenance + accepted tick.
// Granular provenance (proposed / edited / authored) lives in the node panel.
function ownerChip(n){
  return n.accepted ? `<span class="own own-yours">Yours</span>` : `<span class="own own-draft">AI draft</span>`;
}
function nodeCard(n, cls, parent){
  const sel = n.id===state.selected ? "sel" : "";
  const phase = PHASES.find(p=>p.id===n.phase);
  const drag = cls==="root" ? "" : `draggable="true" data-parent="${parent}"`;
  const grip = cls==="root" ? "" : `<span class="node-grip" title="Drag to reorder">⠿</span>`;
  let meta = "";
  if(cls==="root"){
    meta = `<div class="node-meta"><span class="own own-yours">Grand question</span></div>`;
  } else {
    meta = `<div class="node-meta">
      <span class="chip phase-${n.phase}">${phase.label}</span>
      ${ownerChip(n)}
    </div>`;
  }
  return `<div class="node ${cls} ${sel}" data-id="${n.id}" ${drag}>
    <div class="node-head">${grip}<div class="node-title">${esc(n.title)}</div></div>
    ${meta}
  </div>`;
}

/* ---------- board view: nodes regrouped by phase (status board) ---------- */
function boardItems(){
  const items = [];
  state.order.forEach((id,i)=>{
    items.push({n:state.nodes[id], parent:null, num:i+1});
    state.nodes[id].children.forEach(cid => items.push({n:state.nodes[cid], parent:state.nodes[id], num:i+1}));
  });
  return items;
}
function renderBoard(area){
  const items = boardItems();
  area.innerHTML = `<div class="board">${PHASES.map(ph=>{
    const inCol = items.filter(it => it.n.phase===ph.id);
    return `<div class="col">
      <div class="col-head"><span class="lbl">${ph.label}</span><span class="ct">${inCol.length}</span></div>
      ${inCol.length ? inCol.map(bcard).join("") : `<div class="col-empty">·</div>`}
    </div>`;
  }).join("")}</div>`;
  area.querySelectorAll(".bcard").forEach(el=> el.onclick = ()=>{ state.selected = el.dataset.id; render(); });
}
function bcard(it){
  const n = it.n;
  const sel = n.id===state.selected ? "sel" : "";
  const agent = n.agentId ? state.connectedAgents[n.agentId] : null;
  let foot = "";
  if(n.phase==="executing"){
    foot = agent
      ? `<div class="brun"><div class="progress"><i style="width:${n.progress}%"></i></div><div class="activity">${esc(agent.name)}: ${esc(agentActivity(n))}</div></div>`
      : `<div class="activity"><span class="dot-run"></span> in progress · you</div>`;
  } else if(n.phase==="finding" && n.finding){
    foot = `<div class="bfind">${esc(n.finding.slice(0,96))}${n.finding.length>96?"…":""}</div>`;
  } else if(n.phase!=="finding"){
    foot = `<div class="bhint">${n.accepted ? "ready to run" : "accept to run"}</div>`;
  }
  return `<div class="bcard ${sel}" data-id="${n.id}">
    ${it.parent ? `<div class="bcard-parent">↳ ${esc(it.parent.title.slice(0,30))}${it.parent.title.length>30?"…":""}</div>` : `<div class="bcard-parent bcard-num">Node ${it.num}</div>`}
    <div class="bcard-title">${esc(n.title)}</div>
    <div class="bcard-meta">${ownerChip(n)}</div>
    ${foot}
  </div>`;
}
function agentActivity(n){
  const steps = ["reading engagement context", "querying data source", "running the analysis", "drafting the finding"];
  const i = Math.min(steps.length-1, Math.floor(n.progress/25));
  return `${steps[i]}… · ${i+1} tool call${i?"s":""}`;
}

function provLabel(p){ return p==="ai"?"AI proposed":p==="edited"?"AI · you edited":"You authored"; }

/* ---------- detail panel ---------- */
function renderPanel(){
  const p = document.getElementById("panel");
  const n = state.nodes[state.selected];
  if(!n){ p.innerHTML = `<div class="panel-empty">Select a node to see its reasoning.</div>`; return; }
  const isRoot = n.id === state.rootId;

  // active sparring: a question surfaces on its own (adaptive), unless paused or capped
  if(!isRoot && !n.openQ && !n.grillPaused && n.thread.length < GRILL_CAP){
    n.openQ = nextGrillQuestion(n, state.engagements[state.activeId]);
  }
  // Execution is derived from WHICH connected agent (if any) is assigned to this
  // node. No agent assigned = manual, even if agents exist elsewhere. This is
  // the fix for "unclear how this connects to external agents": a node can only
  // run as "Agent" by pointing at a specific, named, connected agent.
  const assignedAgent = n.agentId ? state.connectedAgents[n.agentId] : null;
  if(n.agentId && !assignedAgent) n.agentId = null; // agent was disconnected since assignment
  n.executor = assignedAgent ? "agent" : "manual";
  const executor = n.executor;
  const runLabel = executor === "agent" ? `Dispatch to ${assignedAgent.name} ▷` : "Start (you run this) ▷";
  const showFinding = n.phase==="finding" || (n.phase==="executing" && executor==="manual");

  let footerHtml = "";
  if(!isRoot){
    const del = `<button class="btn btn-ghost btn-sm" id="del" style="margin-left:auto">Delete</button>`;
    if(!n.accepted){
      footerHtml = `<button class="btn btn-accent btn-sm" id="accept">Accept as mine</button>
        <button class="btn btn-sm" id="dispatch" disabled title="Accept the reasoning first">${runLabel}</button>${del}`;
    } else if(n.phase==="executing" && executor==="manual"){
      footerHtml = `<span class="prov human" style="align-self:center">In progress · you</span>
        <button class="btn btn-accent btn-sm" id="markdone">Mark answered ✓</button>${del}`;
    } else if(n.phase==="executing"){
      footerHtml = `<span class="prov human" style="align-self:center">Agent running…</span>${del}`;
    } else if(n.phase==="finding"){
      footerHtml = `<span class="prov human" style="align-self:center">✓ answered</span>${del}`;
    } else {
      footerHtml = `<span class="prov human" style="align-self:center">✓ accepted as yours</span>
        <button class="btn btn-sm" id="dispatch">${runLabel}</button>${del}`;
    }
  }

  p.innerHTML = `
    <div class="panel-head"><div class="side-label">${isRoot?"Grand question":"Pressure-test & own this node"}</div>
      <span class="prov ${n.prov}" style="margin-left:auto">${provLabel(n.prov)}</span>
    </div>
    <div class="panel-body">
      <input class="p-title" id="p-title" value="${esc(n.title)}"/>
      ${isRoot ? `<p style="color:var(--muted);font-size:var(--text-sm);margin:0">This is the question you own. Everything below decomposes it.</p>` : `
      ${(n.rationale.why || n.rationale.order || n.rationale.mece) ? `
      <details class="ai-rat">
        <summary><span class="ai-rat-t">Why the AI put this here</span><span class="ai-rat-badge">reference</span></summary>
        <div class="ai-rat-body">
          ${n.rationale.why?`<p>${esc(n.rationale.why)}</p>`:""}
          ${n.rationale.order?`<p><span class="ai-rat-lbl">Sequence</span> ${esc(n.rationale.order)}</p>`:""}
          ${n.rationale.mece?`<p><span class="ai-rat-lbl">MECE · set-level</span> ${esc(n.rationale.mece)}</p>`:""}
          <p class="ai-rat-note">The AI's proposal. Pressure-test it below; don't just take it.</p>
        </div>
      </details>` : ``}

      <div class="panel-divider"></div>
      ${threadSection(n)}

      ${n.accepted ? `
      <div class="panel-divider"></div>
      <div class="exec-group">
        <div class="exec-group-h">Execution</div>
        <div class="section-h">Run by</div>
        <div class="agent-picker" id="agent-picker">
          ${connectedAgentList().map(a=>`<button class="agent-pick-row ${n.agentId===a.id?"on":""}" data-agent="${a.id}">
              <span class="agent-pick-name">${esc(a.name)}</span>
              <span class="agent-pick-scope">${a.scope.length?esc(a.scope.join(", ")):"no data access configured"}</span>
            </button>`).join("")}
          <button class="agent-pick-row ${!n.agentId?"on":""}" data-agent="">
            <span class="agent-pick-name">Manual (you)</span>
            <span class="agent-pick-scope">An interview, a judgment call, or data an agent can't reach</span>
          </button>
          <button class="agent-pick-row agent-pick-connect" id="agent-pick-connect"><span class="agent-pick-name">+ Connect a new agent</span></button>
        </div>
        ${!connectedAgentList().length ? `<p class="tiny-note">No agents connected yet. Every node runs manually until you connect one, from your global roster (Home → Agents), reusable across every engagement.</p>` : ``}
        ${n.phase==="executing" && executor==="agent" ? execStub(n, assignedAgent) : ""}
        ${showFinding ? findingBlock(n, executor) : ""}
      </div>` : ``}
      `}
    </div>
    ${isRoot ? "" : `<div class="panel-foot">${footerHtml}</div>`}
  `;

  // title edit
  const pt = document.getElementById("p-title");
  pt.oninput = ()=>{ n.title = pt.value; if(!isRoot) markEdited(n); };
  pt.onblur = ()=>renderCanvasLite();

  bindScroll();
  if(isRoot) return;

  // executor (agent vs manual)
  const apk = document.getElementById("agent-picker");
  if(apk) apk.querySelectorAll(".agent-pick-row[data-agent]").forEach(b=> b.onclick=()=>{
    n.agentId = b.dataset.agent || null;
    n.executor = n.agentId ? "agent" : "manual";
    renderPanel(); renderMain();
  });
  const apc = document.getElementById("agent-pick-connect");
  if(apc) apc.onclick = ()=>{ state._connectDraft=null; state.view="connect-agent"; render(); };
  // accept
  const acc = document.getElementById("accept");
  if(acc) acc.onclick = ()=>{ n.accepted = true; n.prov = "human"; toast("Accepted. Now authored by you"); render(); };
  // dispatch / start. agent streams a stub; manual just moves to in-progress
  const dz = document.getElementById("dispatch");
  if(dz) dz.onclick = ()=>{
    if(!n.accepted) return;
    setPhase(n, "executing");
    if(n.executor === "agent") runStub(n);
  };
  // mark answered (manual)
  const md = document.getElementById("markdone");
  if(md) md.onclick = ()=>{ if(!n.finding || !n.finding.trim()){ toast("Record the finding first"); return; } setPhase(n, "finding"); };
  // finding edits (manual authoring)
  const fnd = document.getElementById("finding");
  if(fnd) fnd.oninput = ()=>{ n.finding = fnd.value; };
  // sparring: pause / resume / keep going
  const pauseBtn = document.getElementById("th-pause");
  if(pauseBtn) pauseBtn.onclick = ()=>{ n.grillPaused = true; n.openQ = null; renderPanel(); };
  const resumeBtn = document.getElementById("th-resume");
  if(resumeBtn) resumeBtn.onclick = ()=>{ n.grillPaused = false; renderPanel(); };
  const moreBtn = document.getElementById("th-more");
  if(moreBtn) moreBtn.onclick = ()=>{ n.openQ = nextGrillQuestion(n, state.engagements[state.activeId]); renderPanel(); };
  // answering + tagging commits the entry; the next question auto-surfaces (active grilling)
  p.querySelectorAll("#th-typepick .th-typebtn").forEach(b=> b.onclick=()=>{
    const ta = document.getElementById("th-answer");
    const a = (ta.value||"").trim();
    if(!a) return toast("Answer before tagging it");
    const type = b.dataset.t;
    n.thread.push({ q: n.openQ, a, type, followup: grillFollowup(type) });
    n.openQ = n.thread.length < GRILL_CAP ? nextGrillQuestion(n, state.engagements[state.activeId]) : null;
    markEdited(n);
    toast(type==="confirmed" ? "Captured. Eligible for the client update" : "Captured. Held internal until confirmed");
    renderPanel();
  });
  // delete
  document.getElementById("del").onclick = ()=>deleteNode(n.id);
}

function execStub(n, agent){
  const name = agent ? agent.name : "agent";
  const scope = agent && agent.scope.length ? agent.scope.join(", ") : null;
  return `<div class="exec-stub">
    <div class="exec-head"><span class="dot-run"></span> Running on ${esc(name)}${scope?` <span class="exec-scope">· ${esc(scope)}</span>`:""}</div>
    <div class="progress"><i style="width:${n.progress}%"></i></div>
    <div class="activity">${esc(agentActivity(n))}</div>
    <div class="exec-note">Mock stream. Real agent activity (tool calls, artifacts, tokens, cost) and interrupt/approve controls land here.</div>
  </div>`;
}
function threadSection(n){
  const items = n.thread.map(t=>`
    <div class="th-item">
      <div class="th-q">${esc(t.q)}</div>
      <div class="th-a">${esc(t.a)}</div>
      <div class="th-foot"><span class="th-type ${t.type}">${t.type}</span></div>
      ${t.followup?`<div class="th-follow">↳ ${esc(t.followup)}</div>`:""}
    </div>`).join("");
  let open;
  if(n.openQ){
    open = `
    <div class="th-open">
      <div class="th-open-top"><span class="th-live"><span class="dot-run"></span> ${esc(GRILL_NAME.toLowerCase())} · your turn</span><button class="th-pause" id="th-pause">Pause</button></div>
      <div class="th-q">${esc(n.openQ)}</div>
      <textarea class="rationale" id="th-answer" placeholder="Answer, think out loud…"></textarea>
      <div class="th-hint">Tag how solid this is. Assumptions &amp; hypotheses stay internal; only confirmed can reach the client.</div>
      <div class="th-typepick" id="th-typepick">
        <button class="th-typebtn confirmed" data-t="confirmed">✓ Confirmed</button>
        <button class="th-typebtn assumption" data-t="assumption">~ Assumption</button>
        <button class="th-typebtn hypothesis" data-t="hypothesis">? Hypothesis</button>
      </div>
    </div>`;
  } else if(n.grillPaused){
    open = `<div class="th-ask"><button class="btn btn-sm" id="th-resume">▷ Resume ${esc(GRILL_NAME.toLowerCase())}</button><span class="th-ask-note">${n.thread.length} captured · paused</span></div>`;
  } else {
    open = `<div class="th-done"><div>You've pushed this hard. ${n.thread.length} captured.</div><button class="btn btn-ghost btn-sm" id="th-more">Push further</button></div>`;
  }
  return `<div class="pt-block">
    <div class="pt-head"><span class="pt-title">${esc(GRILL_NAME)}</span><span class="pt-sub">stress-test your thinking; this is the reasoning you keep</span></div>
    <div class="thread">${items}${open}</div>
  </div>`;
}
function findingBlock(n, executor){
  const ph = executor === "manual"
    ? "Record what you found. This is your analysis, in your words. It feeds back to answer or reframe the question."
    : "What this node concluded. It feeds back to answer or reframe the question.";
  return `<div>
    <div class="section-h">Finding${executor==="manual"?`<span class="hint-inline" style="color:var(--muted)">your analysis</span>`:""}</div>
    <textarea class="rationale" id="finding" placeholder="${ph}">${esc(n.finding||"")}</textarea>
  </div>`;
}

/* ---------- Present: the final deliverable as an editable DECK ---------- */
function buildDeck(e){
  const accepted = e.order.map(id=>e.nodes[id]).filter(b=>b.accepted);
  const slides = [{ kind:"title", title: e.question || "Untitled", subtitle: [e.ctx.client, e.ctx.decision].filter(Boolean).join("   ·   ") }];
  accepted.forEach((b,i)=>{
    const s = threadStats(b);
    const bullets = [];
    if(b.finding) bullets.push(b.finding);
    s.confirmed.forEach(c=> bullets.push(c.a));
    if(!bullets.length) bullets.push("Add the key point for this line of analysis.");
    slides.push({ kind:"content", eyebrow:"Finding "+(i+1), title: b.title, bullets });
  });
  slides.push({ kind:"close", eyebrow:"Recommendation", title:"What we recommend", bullets:["State the recommendation.","State the immediate next step."] });
  return { slides, current:0, savedAt: Date.now() };
}
function slideHtml(s, idx, print){
  const ce = print ? "" : `contenteditable="true" spellcheck="false"`;
  if(s.kind==="title"){
    return `<div class="slide slide-title">
      <div class="slide-brand">Strenaysis</div>
      <h1 class="slide-h1" ${ce} data-edit="title">${esc(s.title||"")}</h1>
      <div class="slide-sub" ${ce} data-edit="subtitle">${esc(s.subtitle||"")}</div>
    </div>`;
  }
  const bullets = (s.bullets||[]).map((b,i)=>`<li>
    <span class="slide-bullet" ${ce} data-edit="bullet:${i}">${esc(b)}</span>
    ${print?"":`<button class="slide-delb" data-delbullet="${i}" title="Remove point">×</button>`}
  </li>`).join("");
  return `<div class="slide slide-content ${s.kind==="close"?"slide-close":""}">
    <div class="slide-eyebrow">${esc(s.eyebrow||"")}</div>
    <h2 class="slide-h2" ${ce} data-edit="title">${esc(s.title||"")}</h2>
    <ul class="slide-bullets">${bullets}</ul>
    ${print?"":`<button class="slide-addb" id="pz-add-bullet">+ point</button>`}
    <div class="slide-foot">Strenaysis · ${idx+1}</div>
  </div>`;
}
function renderPresent(){
  const e = state.engagements[state.activeId];
  if(!e.deck) e.deck = buildDeck(e);
  const deck = e.deck;
  deck.current = Math.max(0, Math.min(deck.current, deck.slides.length-1));
  const cur = deck.slides[deck.current];

  root.innerHTML = `
    <div class="pz">
      <div class="dv-bar">
        <button class="btn btn-sm" id="pz-back">← Back to canvas</button>
        <span class="pz-title">Present · deck</span>
        <span class="dv-spacer"></span>
        <span class="pz-saved" id="pz-saved">All changes saved</span>
        <button class="btn btn-sm" id="pz-rebuild">Rebuild from canvas</button>
        <button class="btn btn-primary btn-sm" id="pz-export">Export ↧ PDF</button>
      </div>
      <div class="pz-stage-wrap">
        <button class="pz-nav" id="pz-prev" ${deck.current===0?"disabled":""}>‹</button>
        <div class="pz-stage">${slideHtml(cur, deck.current)}</div>
        <button class="pz-nav" id="pz-next" ${deck.current>=deck.slides.length-1?"disabled":""}>›</button>
      </div>
      <div class="pz-rail">
        ${deck.slides.map((s,i)=>`<button class="pz-thumb ${i===deck.current?"on":""}" data-slide="${i}"><span class="pz-thumb-n">${i+1}</span><span class="pz-thumb-t">${esc((s.title||"Untitled").slice(0,42))}</span></button>`).join("")}
      </div>
      <div class="pz-print">${deck.slides.map((s,i)=>`<div class="pz-print-slide">${slideHtml(s,i,true)}</div>`).join("")}</div>
    </div>`;

  document.getElementById("pz-back").onclick = ()=>{ state.view="canvas"; render(); };
  document.getElementById("pz-prev").onclick = ()=>{ if(deck.current>0){ deck.current--; renderPresent(); } };
  document.getElementById("pz-next").onclick = ()=>{ if(deck.current<deck.slides.length-1){ deck.current++; renderPresent(); } };
  document.getElementById("pz-export").onclick = ()=>window.print();
  document.getElementById("pz-rebuild").onclick = ()=>{ e.deck = buildDeck(e); renderPresent(); toast("Deck rebuilt from the canvas. Edits reset"); };
  root.querySelectorAll("[data-slide]").forEach(el=> el.onclick = ()=>{ deck.current = +el.dataset.slide; renderPresent(); });
  root.querySelectorAll(".pz-stage [contenteditable][data-edit]").forEach(el=>{
    el.oninput = ()=>{
      const path = el.dataset.edit;
      if(path==="title") cur.title = el.textContent;
      else if(path==="subtitle") cur.subtitle = el.textContent;
      else if(path.startsWith("bullet:")) cur.bullets[+path.split(":")[1]] = el.textContent;
      deck.savedAt = Date.now();
      const sv = document.getElementById("pz-saved"); if(sv) sv.textContent = "Saved just now";
    };
  });
  const addB = document.getElementById("pz-add-bullet");
  if(addB) addB.onclick = ()=>{ cur.bullets.push("New point"); renderPresent(); };
  root.querySelectorAll("[data-delbullet]").forEach(el=> el.onclick = ()=>{ cur.bullets.splice(+el.dataset.delbullet,1); renderPresent(); });
}

/* ============================================================
   Communicate: membranes over the same node graph
   ============================================================ */
// One switcher across all outward-facing membranes, shown in both the
// Communicate and Deliverable bars so the model reads as one coherent set.
function membraneSwitcherHtml(active){
  const tabs = [["client","Client update"],["teammate","Teammate brief"]];
  return `<div class="seg" id="membrane">${tabs.map(([k,l])=>`<button data-mb="${k}" class="${active===k?"on":""}">${l}</button>`).join("")}</div>`;
}
function wireMembraneSwitcher(){
  document.querySelectorAll("#membrane button").forEach(b=> b.onclick=()=>{
    state.view="communicate"; state.membrane=b.dataset.mb; render();
  });
}

function renderCommunicate(){
  root.innerHTML = `
    <div class="dv">
      <div class="dv-bar">
        <button class="btn btn-sm" id="cm-back">← Back to canvas</button>
        ${membraneSwitcherHtml(state.membrane)}
        <span class="dv-spacer"></span>
      </div>
      <div id="cm-body"></div>
    </div>`;
  document.getElementById("cm-back").onclick = ()=>{ state.view="canvas"; render(); };

  renderMembrane();
}

function renderMembrane(){
  const body = document.getElementById("cm-body");
  const e = state.engagements[state.activeId];
  body.innerHTML = state.membrane === "client" ? clientUpdateHtml(e) : teammateBriefHtml(e);
  wireMembrane(e);
}

// --- Client update: auto-drafted from node deltas, provenance floor = accepted ---
function clientUpdateHtml(e){
  const pub = e.published;
  const visible = e.order.map(id=>e.nodes[id]).filter(b=>b.accepted); // provenance floor
  const hiddenDrafts = e.order.length - visible.length;
  const isNew = (b)=> !pub || pub.states[b.id] !== b.phase;

  const answered = visible.filter(b=>b.phase==="finding");
  const running  = visible.filter(b=>b.phase==="executing");
  const opened   = visible.filter(b=>b.phase==="question" || b.phase==="approach");
  const changed  = visible.filter(isNew);

  const headline = composeHeadline(e, answered, running, opened, changed, pub);
  const total = visible.length;
  const pct = total ? Math.round(answered.length/total*100) : 0;

  // showPhase: the section header already states the phase for "resolved" and
  // "underway" groups (every card in them shares one phase), so repeating it as
  // a chip is pure duplication. "Still to do" mixes Open + Framed, so the chip
  // there carries real information and stays.
  const branchLine = (b, showPhase)=>{
    const s = threadStats(b);
    const held = s.assumption.length + s.hypothesis.length;
    const meta = showPhase || isNew(b)
      ? `<div class="cu-branch-meta">${showPhase?`<span class="chip phase-${b.phase}">${clientPhase(b.phase)}</span>`:""}${isNew(b)?`<span class="cu-tag">new</span>`:""}</div>`
      : "";
    return `<div class="cu-branch ${isNew(b)?"cu-new":""}">
      <div class="cu-branch-title">${esc(b.title)}</div>
      ${meta}
      ${b.finding?`<p class="cu-finding">${esc(b.finding)}</p>`:""}
      ${s.confirmed.length?`<ul class="cu-confirmed">${s.confirmed.map(c=>`<li>${esc(c.a)}</li>`).join("")}</ul>`:""}
      ${held?`<p class="cu-internal">${held} point${held>1?"s":""} still being validated; held back until confirmed.</p>`:""}
    </div>`;
  };

  return `
    <div class="dv-page cu-page">
      <div class="cu-draftbar">
        <div><span class="dot-run" style="background:var(--accent)"></span> <b>Always current.</b> Composed from your canvas. Send it through your own channel.</div>
        <div class="cu-actions">
          <button class="btn btn-accent btn-sm" id="cu-email">Copy as email</button>
          <button class="btn btn-sm" id="cu-pdf">Export PDF</button>
          ${pub?`<button class="btn btn-sm" id="cu-viewclient">Preview client view ↗</button>`:``}
        </div>
      </div>
      <div class="dv-kicker">Progress update${e.ctx.client?` · for ${esc(e.ctx.client)}`:""}</div>
      <h1>${esc(e.question)}</h1>
      ${e.ctx.decision?`<p class="cu-goal">Toward your decision: <b>${esc(e.ctx.decision)}</b></p>`:""}
      <div class="cu-progress"><div class="cu-progress-bar"><i style="width:${pct}%"></i></div><span class="cu-progress-txt">${answered.length} of ${total} lines resolved · ${pct}% toward a recommendation</span></div>
      <p class="cu-meta">${pub?`Last shared ${relTime(pub.at)} · ${changed.length} update${changed.length===1?"":"s"} since`:"Not yet shared with the client"}</p>

      <div class="cu-headline">${headline}</div>

      ${answered.length?`<div class="cu-sec"><div class="cu-sec-h">What we've resolved</div>${answered.map(b=>branchLine(b,false)).join("")}</div>`:""}
      ${running.length?`<div class="cu-sec"><div class="cu-sec-h">Underway</div>${running.map(b=>branchLine(b,false)).join("")}</div>`:""}
      ${opened.length?`<div class="cu-sec"><div class="cu-sec-h">Still to do</div>${opened.map(b=>branchLine(b,true)).join("")}</div>`:""}

      <div class="cu-sec">
        <div class="cu-sec-h">Requests outside current scope</div>
        <p class="cu-note">New asks land here, visible and negotiable, so they don't silently expand the work.</p>
        ${e.requests.length?e.requests.map((r,i)=>`<div class="cu-req"><span>${esc(r.text)}</span><span class="cu-req-when">${relTime(r.at)}</span></div>`).join(""):`<div class="cu-empty-row">No out-of-scope requests logged.</div>`}
        <div class="cu-addrow"><input id="cu-req-input" placeholder="Log a new client ask…" /><button class="btn btn-sm" id="cu-req-add">Add</button></div>
      </div>

      ${e.reactions.length?`<div class="cu-sec cu-internal-sec"><div class="cu-sec-h">Client reactions captured</div>${e.reactions.map(r=>`<div class="cu-react"><span class="cu-react-kind ${r.kind}">${r.kind==="aligned"?"✓ aligned":"? question"}</span><span>${esc(r.note||"")}</span><span class="cu-req-when">${relTime(r.at)}</span></div>`).join("")}</div>`:""}

      <footer class="dv-foot">${hiddenDrafts>0?`${hiddenDrafts} draft node${hiddenDrafts===1?"":"s"} hidden; only reasoning you've accepted is shown to the client.`:"Only accepted reasoning is shown to the client."}</footer>
    </div>`;
}

function clientPhase(phase){
  return { question:"Planned", approach:"Planned", executing:"In progress", finding:"Complete" }[phase] || phase;
}
function composeHeadline(e, answered, running, opened, changed, pub){
  const total = answered.length + running.length + opened.length;
  const goal = e.ctx.decision ? `your decision on “${esc(e.ctx.decision)}”` : "your question";
  let lead;
  if(!total) lead = `We're framing the analysis behind ${goal}.`;
  else if(answered.length===total) lead = `The analysis behind ${goal} is complete. Here's what we found.`;
  else lead = `Here's what we now know toward ${goal}, and what's still open.`;
  const finding = answered.find(b=>b.finding);
  const secondary = finding ? `Latest finding: ${esc(finding.finding)}`
    : (pub ? `${changed.length} update${changed.length===1?"":"s"} since you last saw this.` : "");
  return `<p>${lead}</p>${secondary?`<p>${secondary}</p>`:""}`;
}

// --- Teammate brief: the why, fast ---
function teammateBriefHtml(e){
  const branches = e.order.map(id=>e.nodes[id]);
  const decided = branches.filter(b=>b.accepted);
  const live = branches.filter(b=>b.accepted && (b.phase==="executing"));
  const openQs = [];
  branches.forEach(b=> b.children.forEach(cid=>{ const c=e.nodes[cid]; if(c.phase==="question") openQs.push({c, parent:b}); }));
  const modelName = (MODELS.find(m=>m.id===e.model)||{}).name || "";

  const decisionRow = (b)=>{
    const s = threadStats(b);
    const bAgent = b.agentId ? state.connectedAgents[b.agentId] : null;
    const epi = [];
    if(s.confirmed.length) epi.push(`${s.confirmed.length} confirmed`);
    if(s.assumption.length) epi.push(`${s.assumption.length} assumption${s.assumption.length>1?"s":""}`);
    if(s.hypothesis.length) epi.push(`${s.hypothesis.length} hypothes${s.hypothesis.length>1?"es":"is"}`);
    return `<div class="tb-row">
      <div class="tb-row-title">${esc(b.title)}</div>
      ${b.rationale.why?`<p class="tb-why"><span class="lbl">why</span> ${esc(b.rationale.why)}</p>`:""}
      <div class="tb-row-meta"><span class="chip phase-${b.phase}">${PHASES.find(p=>p.id===b.phase).label}</span>
        <span class="chip">${bAgent?esc(bAgent.name):"manual"}</span>
        ${epi.length?`<span class="chip">${epi.join(" · ")}</span>`:""}
        ${b.finding?`<span class="tb-has-finding">finding recorded</span>`:""}</div>
    </div>`;
  };
  const openAssumptions = [];
  branches.forEach(b=> (b.thread||[]).forEach(t=>{ if(t.type!=="confirmed") openAssumptions.push({t, b}); }));

  return `
    <div class="dv-page">
      <div class="dv-kicker">Teammate brief · get up to speed in minutes, not a week</div>
      <h1>${esc(e.question)}</h1>
      <p class="dv-decision">${esc(e.ctx.client||"")}${e.ctx.decision?` · feeds: ${esc(e.ctx.decision)}`:""}</p>

      <div class="tb-sec"><div class="cu-sec-h">Where it stands</div>
        <p class="tb-standing">${decided.length} of ${branches.length} nodes owned · ${live.length} running · ${openQs.length} open question${openQs.length===1?"":"s"}. Reasoning model: ${esc(e.model==="none"?"none (manual)":modelName)}.</p>
      </div>

      <div class="tb-sec"><div class="cu-sec-h">Decisions & why</div>
        ${decided.length?decided.map(decisionRow).join(""):`<div class="cu-empty-row">Nothing accepted yet; this engagement is still being framed.</div>`}
      </div>

      <div class="tb-sec"><div class="cu-sec-h">Live now: who owns what</div>
        ${live.length?live.map(b=>{const bAgent=b.agentId?state.connectedAgents[b.agentId]:null; return `<div class="tb-live"><span>${esc(b.title)}</span><span class="tb-owner">${bAgent?esc(bAgent.name):"you (manual)"}</span></div>`;}).join(""):`<div class="cu-empty-row">Nothing running right now.</div>`}
      </div>

      <div class="tb-sec"><div class="cu-sec-h">Open questions</div>
        ${openQs.length?openQs.map(o=>`<div class="tb-open">${esc(o.c.title)} <span class="tb-under">under ${esc(o.parent.title.slice(0,40))}</span></div>`).join(""):`<div class="cu-empty-row">No open sub-questions.</div>`}
      </div>

      <div class="tb-sec"><div class="cu-sec-h">Assumptions in play</div>
        ${openAssumptions.length?openAssumptions.map(o=>`<div class="tb-open"><span class="th-type ${o.t.type}">${o.t.type}</span> ${esc(o.t.a)} <span class="tb-under">· ${esc(o.b.title.slice(0,36))}</span></div>`).join(""):`<div class="cu-empty-row">No open assumptions recorded.</div>`}
      </div>

      <div class="tb-sec"><div class="cu-sec-h">Landmines & data caveats</div>
        <p class="tb-caveat">${e.ctx.data?esc(e.ctx.data):"No data constraints recorded."}</p>
      </div>
    </div>`;
}

function buildClientSnapshot(e){
  const visible = e.order.map(id=>e.nodes[id]).filter(b=>b.accepted);
  return {
    question: e.question, client: e.ctx.client, decision: e.ctx.decision, at: Date.now(),
    branches: visible.map(b=>{ const s=threadStats(b); return {
      title:b.title, phase:b.phase, finding:b.finding,
      confirmed:s.confirmed.map(c=>c.a), held:s.assumption.length+s.hypothesis.length }; }),
    requests: e.requests.map(r=>({text:r.text})),
  };
}
function markShared(e){
  const states = {}; e.order.forEach(id=>states[id]=e.nodes[id].phase);
  e.published = { at: Date.now(), states, snapshot: buildClientSnapshot(e) };
}
function copyText(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).catch(()=>fallbackCopy(txt)); return; }
  fallbackCopy(txt);
}
function fallbackCopy(txt){
  try{ const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.top="-2000px"; document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); }catch(e){}
}
function composeEmailText(e){
  const visible = e.order.map(id=>e.nodes[id]).filter(b=>b.accepted);
  const answered = visible.filter(b=>b.phase==="finding");
  const running  = visible.filter(b=>b.phase==="executing");
  const open     = visible.filter(b=>b.phase==="question"||b.phase==="approach");
  const total = visible.length, pct = total? Math.round(answered.length/total*100):0;
  const name = (e.ctx.client||"").split(/[,+/]/)[0].trim();
  const L = [];
  L.push(`Subject: Progress update on ${e.question}`, "");
  L.push(`Hi${name?` ${name}`:" there"},`, "");
  L.push(`A quick update on ${e.ctx.decision? `your decision on ${e.ctx.decision}` : `"${e.question}"`}. We're about ${pct}% of the way to a recommendation (${answered.length} of ${total} lines of analysis resolved).`, "");
  if(answered.length){
    L.push("What we've resolved:");
    answered.forEach(b=>{ const s=threadStats(b); L.push(`  • ${b.finding || (s.confirmed[0]&&s.confirmed[0].a) || b.title}`); });
    L.push("");
  }
  if(running.length||open.length){
    L.push("Underway / still to do:");
    running.concat(open).forEach(b=> L.push(`  • ${b.title}`));
    L.push("");
  }
  if(e.requests.length){
    L.push("New requests outside current scope (happy to discuss timing + impact):");
    e.requests.forEach(r=> L.push(`  • ${r.text}`));
    L.push("");
  }
  L.push("Happy to walk through any of this.", "", "Best,", "[your name]");
  return L.join("\n");
}
function wireMembrane(e){
  const em = document.getElementById("cu-email");
  if(em) em.onclick = ()=>{ copyText(composeEmailText(e)); markShared(e); toast("Email copied. Paste into your client email"); renderMembrane(); };
  const pdf = document.getElementById("cu-pdf");
  if(pdf) pdf.onclick = ()=>{ window.print(); };
  const vc = document.getElementById("cu-viewclient");
  if(vc) vc.onclick = ()=>{ state.view="clientview"; render(); };
  const addBtn = document.getElementById("cu-req-add");
  if(addBtn) addBtn.onclick = ()=>{
    const inp = document.getElementById("cu-req-input"); const v = inp.value.trim();
    if(!v) return toast("Type the request first");
    e.requests.unshift({text:v, at:Date.now()}); renderMembrane();
  };
}

// The read-only, client-facing view of a PUBLISHED update (not the live draft).
// Dark bar signals you've stepped out of the working tool into what the client sees.
function renderClientView(){
  const e = state.engagements[state.activeId];
  const snap = e.published && e.published.snapshot;
  root.innerHTML = `
    <div class="dv cv">
      <div class="dv-bar cv-bar">
        <div class="cv-from">Shared with you via Strenaysis${snap&&snap.client?` · ${esc(snap.client)}`:""}</div>
        <span class="dv-spacer"></span>
        <button class="btn btn-sm" id="cv-exit">Exit client view</button>
      </div>
      ${snap ? clientReadonlyHtml(snap) : `<div class="dv-empty"><h1>Nothing shared yet</h1><p>Publish an update to generate the client's view.</p></div>`}
    </div>`;
  document.getElementById("cv-exit").onclick = ()=>{ state.view="communicate"; state.membrane="client"; render(); };
  root.querySelectorAll("[data-react]").forEach(b=> b.onclick=()=>{
    const kind = b.dataset.react;
    e.reactions.unshift({ kind, note: kind==="aligned" ? "Looks aligned." : "Flagged a question here.", at: Date.now() });
    toast(kind==="aligned" ? "Marked aligned. Captured back to the consultant" : "Question flagged. Captured back to the consultant");
    render();
  });
}
function clientReadonlyHtml(snap){
  const label = { question:"Planned", approach:"Planned", executing:"In progress", finding:"Complete" };
  const cls = { question:"plan", approach:"plan", executing:"prog", finding:"done" };
  const branch = (b)=>`<section class="dv-branch cv-branch">
    <h2><span class="chip cv-status ${cls[b.phase]||"plan"}">${label[b.phase]||b.phase}</span> <span>${esc(b.title)}</span></h2>
    ${b.finding?`<p class="cu-finding">${esc(b.finding)}</p>`:""}
    ${b.confirmed.length?`<ul class="cu-confirmed">${b.confirmed.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`:""}
    ${b.held?`<p class="cu-internal">${b.held} point${b.held>1?"s":""} still being validated.</p>`:""}
  </section>`;
  return `<article class="dv-page">
    <div class="dv-kicker">Project update · ${relTime(snap.at)}</div>
    <h1>${esc(snap.question)}</h1>
    ${snap.decision?`<p class="dv-decision">${esc(snap.decision)}</p>`:""}
    ${snap.branches.map(branch).join("")}
    ${snap.requests.length?`<div class="cu-sec"><div class="cu-sec-h">Requests outside current scope</div>${snap.requests.map(r=>`<div class="cu-req"><span>${esc(r.text)}</span></div>`).join("")}</div>`:""}
    <div class="cv-react"><span>Does this look right to you?</span>
      <button class="btn btn-sm" data-react="aligned">✓ Looks aligned</button>
      <button class="btn btn-sm" data-react="question">? I have a question</button></div>
    <footer class="dv-foot">You're viewing the published update, not the consultant's working draft.</footer>
  </article>`;
}

/* ============================================================
   Mutations
   ============================================================ */
function markEdited(n){
  if(n.prov === "ai"){ n.prov = "edited"; }
  // update just the provenance badge live without full re-render (keeps focus)
  const badge = document.querySelector(".panel-head .prov");
  if(badge){ badge.className = "prov "+n.prov; badge.style.marginLeft="auto"; badge.textContent = provLabel(n.prov); }
}
function setPhase(n, ph){
  if((ph==="executing"||ph==="finding") && !n.accepted){ toast("Accept the reasoning before executing"); return; }
  n.phase = ph;
  render();
}
function runStub(n){
  n.progress = 0;
  toast("Agent working (simulated)");
  const iv = setInterval(()=>{
    n.progress = Math.min(100, n.progress + 20);
    if(state.view==="canvas"){
      if(state.filter==="board") renderMain();
      if(state.selected===n.id && n.phase==="executing"){
        const bar = document.querySelector(".exec-stub .progress > i"); if(bar) bar.style.width = n.progress+"%";
        const act = document.querySelector(".exec-stub .activity"); if(act) act.textContent = agentActivity(n);
      }
    }
    if(n.progress>=100){
      clearInterval(iv);
      n.phase = "finding";
      n.finding = `Simulated finding for this branch. In the full product this is the agent's real output; it feeds back to answer or reframe the question.`;
      if(state.view==="canvas"){ if(state.selected===n.id) renderPanel(); renderMain(); }
      toast("Finding ready");
    }
  }, 550);
}
function addNode(parent){
  const isTop = parent === "root";
  const id = nid();
  const node = mkNode(id, isTop?"New node (name it)":"New sub-question", isTop?"approach":"question", "human", false, [], {why:"",order:"",mece:""});
  state.nodes[id] = node;
  if(isTop) state.order.push(id);
  else state.nodes[parent].children.push(id);
  state.selected = id;
  render();
}
function deleteNode(id){
  const topIdx = state.order.indexOf(id);
  if(topIdx>=0){
    state.nodes[id].children.forEach(c=>delete state.nodes[c]);
    state.order.splice(topIdx,1);
  } else {
    state.order.forEach(pid=>{
      const ci = state.nodes[pid].children.indexOf(id);
      if(ci>=0) state.nodes[pid].children.splice(ci,1);
    });
  }
  delete state.nodes[id];
  state.selected = state.order[0] || null;
  render();
}
function acceptedCount(){ return state.order.filter(id=>state.nodes[id].accepted).length; }
function branchCount(){ return state.order.length; }

/* light re-render of canvas tree only (title/rationale changed) */
function renderCanvasLite(){ renderMain(); }

/* ============================================================
   Utils
   ============================================================ */
function esc(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
let toastT;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("show"), 1900);
}

/* ---------- seed sample engagements so home is alive ---------- */
function seedAgent(over){
  const a = newAgentObj(over);
  state.connectedAgents[a.id] = a; state.agentOrder.push(a.id);
  return a;
}
const seedResearchAgent = seedAgent({ name:"Research Agent", provider:"anthropic", scope:["BigQuery","Hex"], connectedAt: Date.now()-1000*60*60*24*9 });
const seedSqlAgent = seedAgent({ name:"SQL Agent", provider:"openai", scope:["Snowflake"], connectedAt: Date.now()-1000*60*60*24*3 });

function seedEngagement({client, question, model, ctx, mutate}){
  const e = newEngagementObj({question, model, ctx});
  const res = proposeDecomposition(question, ctx);
  e.rootId = res.rootId; e.nodes = res.nodes; e.order = res.order; e.selected = res.order[0];
  if(mutate) mutate(e);
  state.engagements[e.id] = e; state.engOrder.push(e.id);
  return e;
}
seedEngagement({
  model:"opus",
  question:"Should Northwind expand into the SMB segment next year?",
  ctx:{client:"Northwind's VP of Growth", decision:"Whether to fund an SMB go-to-market in FY26", data:"3 yrs CRM + billing; no product telemetry"},
  mutate:(e)=>{
    const [b0,b1,b2]=e.order.map(id=>e.nodes[id]);
    b0.accepted=true; b0.prov="human"; b0.phase="finding"; b0.agentId=seedResearchAgent.id; b0.executor="agent";
    b0.finding="Demand is concentrated: 2 of 5 CRM cohorts drive 80% of SMB intent; the rest are flat. Points to a targeted motion.";
    b0.thread=[
      {q:"What would have to be true for this to be worth investigating at all?", a:"SMB buyers behave as a distinct segment, not just small mid-market, checked against 3 yrs of CRM.", type:"confirmed", followup:grillFollowup("confirmed")},
      {q:"What's your current best answer, and how confident are you, honestly?", a:"~70% confident demand is durable; the cohort concentration still surprises me and could be seasonal.", type:"assumption", followup:grillFollowup("assumption")},
    ];
    b1.accepted=true; b1.prov="human"; b1.phase="executing"; b1.agentId=seedSqlAgent.id; b1.executor="agent"; b1.progress=60;
    b2.accepted=true; b2.prov="edited"; b2.executor="manual";
    e.updatedAt = Date.now()-1000*60*8;
    // last week everything was still just framed, so the diff shows this cycle's movement
    e.savedAsTemplate = true;
    e.published = { at: Date.now()-1000*60*60*24*6, states:{ [b0.id]:"approach", [b1.id]:"approach", [b2.id]:"approach" } };
    e.requests = [{text:"While you're in the data, can you also size the enterprise upsell?", at: Date.now()-1000*60*60*20}];
    e.reactions = [{nodeId:b0.id, kind:"aligned", note:"Cohort focus matches what sales is seeing.", at: Date.now()-1000*60*60*2}];
  },
});
seedEngagement({
  model:"gpt",
  question:"How do we cut patient no-show rates in outpatient clinics?",
  ctx:{client:"Meridian Health's Ops Director", decision:"Which interventions to pilot in Q3", data:"18 months of scheduling + reminder logs"},
  mutate:(e)=>{ const b0=e.nodes[e.order[0]]; b0.accepted=true; b0.prov="edited"; e.updatedAt = Date.now()-1000*60*60*5; },
});
seedEngagement({
  model:"none",

  ctx:{client:"Volta Retail's CFO", decision:"Whether to keep, reprice, or retire the mid-tier", data:"billing + plan-change events, 24 months"},
  mutate:(e)=>{ e.updatedAt = Date.now()-1000*60*60*26; },
});

render();
