<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Strenaysis Reasoning Canvas (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   Strenaysis reasoning canvas (standalone prototype)
   Design tokens shared with the main app (web/styles.css).
   No build step, no server, no network: mock LLM runs inline.
   ============================================================ */
:root{
  --bg:oklch(98.5% 0.004 250); --surface:oklch(100% 0 0); --surface-2:oklch(96.5% 0.005 250);
  --ink:oklch(20% 0.015 260); --ink-soft:oklch(36% 0.012 260); --muted:oklch(55% 0.01 260);
  --faint:oklch(72% 0.008 260); --line:oklch(91% 0.008 260); --line-soft:oklch(95% 0.006 260);
  --accent:oklch(48% 0.14 258); --accent-ink:oklch(38% 0.15 258); --accent-bg:oklch(96% 0.03 258);
  --success:oklch(52% 0.11 160); --success-bg:oklch(96% 0.03 160);
  --warning:oklch(62% 0.13 60); --warning-bg:oklch(96% 0.04 75);
  --human:oklch(50% 0.13 300); --human-bg:oklch(96% 0.03 300);
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --text-xs:.6875rem; --text-sm:.8125rem; --text-base:.9375rem; --text-lg:1.0625rem; --text-xl:1.25rem; --text-2xl:2rem;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:28px; --s-7:40px; --s-8:56px;
  --radius:10px; --radius-sm:6px;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--text-base);line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11";}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;}
::selection{background:var(--accent-bg);color:var(--accent-ink);}
.mono{font-family:var(--mono);}
.hidden{display:none !important;}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:var(--radius-sm);font-size:var(--text-sm);font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:.12s;}
.btn:hover{border-color:var(--faint);}
.btn-primary{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.btn-primary:hover{background:oklch(28% 0.02 260);}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-accent:hover{filter:brightness(1.08);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-sm{padding:5px 10px;font-size:var(--text-xs);}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted);}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink);}

/* ---------- intake / interrogate (centered) ---------- */
.stage{min-height:100vh;display:grid;place-items:center;padding:var(--s-7);}
.stage-card{width:min(680px,100%);}
.kicker{font-family:var(--mono);font-size:var(--text-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:var(--s-4);}
.stage h1{font-size:var(--text-2xl);letter-spacing:-.02em;line-height:1.1;margin:0 0 var(--s-3);}
.stage .lede{color:var(--ink-soft);font-size:var(--text-lg);margin:0 0 var(--s-6);max-width:52ch;}
.field{width:100%;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:var(--s-4);font:inherit;color:var(--ink);resize:vertical;transition:.12s;}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}
textarea.field{min-height:96px;line-height:1.5;}
.row{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;}
.spread{justify-content:space-between;}
.mt-4{margin-top:var(--s-4);} .mt-6{margin-top:var(--s-6);} .mt-2{margin-top:var(--s-2);}

/* model picker */
.model-pick{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:var(--text-sm);background:var(--surface);}
.model-pick select{border:none;background:none;font:inherit;color:var(--ink);font-weight:500;cursor:pointer;outline:none;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--success);}
.dot.off{background:var(--faint);}

/* interrogation questions */
.q-block{border:1px solid var(--line);border-radius:var(--radius);padding:var(--s-4) var(--s-5);margin-bottom:var(--s-3);background:var(--surface);}
.q-block label{display:block;font-weight:500;margin-bottom:2px;}
.q-block .hint{color:var(--muted);font-size:var(--text-sm);margin-bottom:var(--s-3);}
.q-block input{width:100%;border:none;border-bottom:1px solid var(--line);padding:8px 0;font:inherit;background:none;color:var(--ink);}
.q-block input:focus{outline:none;border-color:var(--accent);}
.thinking-note{display:flex;gap:10px;align-items:flex-start;background:var(--warning-bg);border:1px solid oklch(88% 0.05 75);border-radius:var(--radius-sm);padding:var(--s-3) var(--s-4);font-size:var(--text-sm);color:var(--ink-soft);margin-top:var(--s-5);}
.fw-picker{display:flex;gap:6px;flex-wrap:wrap;}
.fw-opt{padding:7px 13px;border:1px solid var(--line);border-radius:999px;font-size:var(--text-sm);color:var(--ink-soft);background:var(--surface);transition:.12s;}
.fw-opt.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.fw-opt:hover:not(.on){border-color:var(--faint);}

/* ---------- canvas app shell ---------- */
.app{display:grid;grid-template-columns:236px 1fr 360px;grid-template-rows:minmax(0,1fr);height:100vh;}
.app.no-panel{grid-template-columns:236px 1fr;}
.side{border-right:1px solid var(--line);background:var(--surface);padding:var(--s-5);display:flex;flex-direction:column;gap:var(--s-5);overflow:auto;min-height:0;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-glyph{width:28px;height:28px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:600;font-size:var(--text-sm);letter-spacing:-.02em;}
.brand-name{font-weight:600;letter-spacing:-.01em;}
.brand-sub{font-size:var(--text-xs);color:var(--muted);}
.side-label{font-family:var(--mono);font-size:var(--text-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:var(--s-2);}
.q-recap{font-size:var(--text-sm);color:var(--ink-soft);line-height:1.45;background:var(--surface-2);border-radius:var(--radius-sm);padding:var(--s-3);}
.ctx-item{font-size:var(--text-sm);padding:6px 0;border-bottom:1px solid var(--line-soft);}
.ctx-item b{font-weight:500;color:var(--ink);} .ctx-item span{color:var(--muted);}

/* main column */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);}
.topbar{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-4) var(--s-5);border-bottom:1px solid var(--line);background:var(--surface);}
.topbar .title{font-weight:600;letter-spacing:-.01em;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);}
.seg button{padding:6px 14px;font-size:var(--text-sm);color:var(--muted);}
.seg button.on{background:var(--ink);color:var(--bg);}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:var(--text-xs);border:1px solid var(--line);color:var(--ink-soft);}

/* the tree canvas */
.canvas{flex:1;overflow:auto;padding:var(--s-7) var(--s-6);}
.tree{display:flex;flex-direction:column;gap:6px;max-width:820px;margin:0 auto;}
.tier-label{font-family:var(--mono);font-size:var(--text-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:var(--s-3) 0 4px 2px;}

/* node card */
.node{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:9px 13px;transition:.12s;cursor:pointer;}
.node:hover{border-color:var(--faint);}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}

/* children group + continuous connectors */
.node-group{display:flex;flex-direction:column;}
.node-kids{position:relative;margin:5px 0 0 20px;padding-left:22px;display:flex;flex-direction:column;gap:5px;}
.node-kids::before{content:"";position:absolute;left:0;top:-7px;bottom:0;width:1.5px;background:var(--line);}
.node.child::before{content:"";position:absolute;left:-22px;top:50%;width:22px;height:1.5px;background:var(--line);}
.node-kids > .node:last-of-type::after{content:"";position:absolute;left:-23px;top:calc(50% + 1px);bottom:-6px;width:3px;background:var(--bg);}
.node.root{background:var(--ink);color:var(--bg);border-color:var(--ink);cursor:default;padding:var(--s-3) var(--s-4);border-radius:var(--radius);}
.node.root .node-title{font-size:var(--text-lg);}
.node.root:hover{border-color:var(--ink);}
.node.root .chip{background:oklch(100% 0 0 / .12);color:oklch(100% 0 0 / .88);border-color:oklch(100% 0 0 / .22);}
.node-head{display:flex;align-items:center;gap:8px;}
.node-title{font-weight:500;letter-spacing:-.005em;flex:1;line-height:1.35;}
.node-grip{width:12px;flex:none;text-align:center;color:var(--faint);font-size:var(--text-sm);line-height:1;cursor:grab;opacity:0;transition:opacity .12s;user-select:none;}
.node:hover .node-grip{opacity:.55;}
.node-grip:active{cursor:grabbing;}
.node.dragging{opacity:.4;}
.node.drop-before{box-shadow:0 -2px 0 0 var(--accent);}
.node.drop-after{box-shadow:0 2px 0 0 var(--accent);}
.node-meta{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;}

/* chips + badges */
.chip{font-size:var(--text-xs);padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;}
.chip.phase-question{background:var(--surface-2);}
.chip.phase-approach{background:var(--accent-bg);color:var(--accent-ink);border-color:transparent;}
.chip.phase-executing{background:var(--accent);color:#fff;border-color:transparent;}
.chip.phase-finding{background:var(--success-bg);color:var(--success);border-color:transparent;}
.prov{font-size:var(--text-xs);padding:2px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.prov.ai{background:var(--surface-2);color:var(--muted);}
.prov.edited{background:var(--accent-bg);color:var(--accent-ink);}
.prov.human{background:var(--human-bg);color:var(--human);}
.prov::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7;}
.accepted-tick{color:var(--success);font-size:var(--text-sm);}
.own{font-size:var(--text-xs);padding:2px 9px;border-radius:999px;white-space:nowrap;font-weight:var(--w-medium);}
.own-yours{background:var(--human-bg);color:var(--human);}
.own-draft{background:var(--surface-2);color:var(--muted);}
.tier-hint{text-transform:none;letter-spacing:0;color:var(--faint);font-weight:var(--w-normal);}

/* add-node affordance */
.add-node{align-self:flex-start;border:1.5px dashed var(--line);border-radius:var(--radius-sm);padding:6px 11px;color:var(--muted);font-size:var(--text-sm);display:inline-flex;gap:6px;align-items:center;transition:.12s;}
.add-node:hover{border-color:var(--accent);color:var(--accent-ink);}
.add-node.child-add{margin:6px 0 0 42px;}
.add-node.add-top{margin:10px 0 0 0;}

/* ---------- right detail panel ---------- */
.panel{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;overflow:hidden;min-height:0;}
.panel-head{padding:var(--s-4) var(--s-5);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;}
.panel-head .side-label{margin:0;}
.panel-body{padding:var(--s-5);overflow:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--s-5);}
.panel-empty{color:var(--muted);font-size:var(--text-sm);padding:var(--s-7) var(--s-5);text-align:center;}
.p-title{width:100%;border:none;font:inherit;font-size:var(--text-lg);font-weight:500;letter-spacing:-.01em;color:var(--ink);background:none;line-height:1.3;}
.p-title:focus{outline:none;}
.section-h{font-size:var(--text-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.rationale{width:100%;border:1px solid var(--line-soft);border-radius:var(--radius-sm);background:var(--surface-2);padding:12px var(--s-3);font:inherit;font-size:var(--text-sm);color:var(--ink-soft);line-height:1.6;resize:vertical;min-height:120px;transition:.12s;}
/* node panel hierarchy */
.panel-divider{height:1px;background:var(--line);margin:var(--s-2) 0;}
.ai-rat{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);overflow:hidden;}
.ai-rat > summary{list-style:none;cursor:pointer;padding:10px var(--s-3);display:flex;align-items:center;gap:8px;font-size:var(--text-sm);color:var(--ink-soft);}
.ai-rat > summary::-webkit-details-marker{display:none;}
.ai-rat > summary::before{content:"▸";color:var(--faint);font-size:var(--text-xs);transition:.12s;}
.ai-rat[open] > summary::before{transform:rotate(90deg);}
.ai-rat-t{font-weight:var(--w-medium);}
.ai-rat-badge{margin-left:auto;font-size:var(--text-xs);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 8px;}
.ai-rat-body{padding:0 var(--s-3) var(--s-3);border-top:1px solid var(--line-soft);}
.ai-rat-body p{margin:var(--s-3) 0 0;font-size:var(--text-sm);color:var(--ink-soft);line-height:1.55;}
.ai-rat-lbl{font-family:var(--mono);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:4px;}
.ai-rat-note{color:var(--muted)!important;font-style:italic;font-size:var(--text-xs)!important;}
.pt-block{}
.pt-head{margin-bottom:var(--s-3);}
.pt-title{display:block;font-size:var(--text-lg);font-weight:var(--w-semibold);letter-spacing:-.01em;color:var(--ink);}
.pt-sub{display:block;font-size:var(--text-xs);color:var(--muted);margin-top:2px;}
.exec-group-h{font-size:var(--text-xs);font-weight:var(--w-semibold);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:var(--s-3);}
.exec-group{display:flex;flex-direction:column;gap:var(--s-3);}
.rationale:focus{outline:none;background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);color:var(--ink);}
.phase-picker{display:flex;gap:6px;flex-wrap:wrap;}
.phase-opt{padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-size:var(--text-xs);color:var(--muted);}
.phase-opt.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.tiny-note{margin:6px 0 0;font-size:var(--text-xs);color:var(--muted);line-height:1.5;}
.section-h .hint-inline{font-weight:var(--w-normal);text-transform:none;letter-spacing:0;color:var(--warning);margin-left:6px;}
.exec-stub{background:var(--accent-bg);border:1px solid oklch(90% 0.03 258);border-radius:var(--radius-sm);padding:var(--s-3) var(--s-4);font-size:var(--text-sm);color:var(--ink-soft);}
.exec-head{display:flex;align-items:center;gap:8px;font-weight:var(--w-medium);color:var(--accent-ink);flex-wrap:wrap;}
.exec-scope{font-weight:var(--w-normal);color:var(--muted);font-size:var(--text-xs);}
/* agent picker (node panel Run by) */
.agent-picker{display:flex;flex-direction:column;gap:6px;}
.agent-pick-row{text-align:left;border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;background:var(--surface);transition:.12s;display:flex;flex-direction:column;gap:2px;}
.agent-pick-row:hover{border-color:var(--faint);}
.agent-pick-row.on{border-color:var(--accent);background:var(--accent-bg);}
.agent-pick-name{font-size:var(--text-sm);font-weight:var(--w-medium);color:var(--ink);}
.agent-pick-scope{font-size:var(--text-xs);color:var(--muted);}
.agent-pick-connect{color:var(--accent-ink);border-style:dashed;text-align:center;font-size:var(--text-sm);}
.agent-pick-connect .agent-pick-name{color:var(--accent-ink);}
.exec-note{font-size:var(--text-xs);color:var(--muted);margin-top:8px;line-height:1.5;}
.activity{font-family:var(--mono);font-size:var(--text-xs);color:var(--muted);margin-top:8px;line-height:1.5;display:flex;align-items:center;gap:6px;}
.progress{height:6px;border-radius:999px;background:oklch(92% 0.02 258);overflow:hidden;margin-top:8px;}
.progress > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s;}
.dot-run{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.4s ease-in-out infinite;flex:none;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
@media (prefers-reduced-motion: reduce){.dot-run{animation:none;}}
.panel-foot{border-top:1px solid var(--line);padding:var(--s-4) var(--s-5);display:flex;gap:8px;flex-wrap:wrap;}

/* status board */
.board{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:var(--s-4);align-items:start;}
.col{display:flex;flex-direction:column;gap:var(--s-3);min-width:0;}
.col-head{display:flex;align-items:center;gap:8px;padding-bottom:var(--s-1);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);}
.col-head .lbl{font-family:var(--mono);font-size:var(--text-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.col-head .ct{font-size:var(--text-xs);color:var(--faint);margin-left:auto;}
.col-empty{font-size:var(--text-xs);color:var(--faint);text-align:center;padding:var(--s-4) 0;}
.bcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:var(--s-3);cursor:pointer;transition:.12s;}
.bcard:hover{border-color:var(--faint);}
.bcard.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}
.bcard-parent{font-size:var(--text-xs);color:var(--faint);margin-bottom:4px;}
.bcard-num{font-family:var(--mono);letter-spacing:.04em;}
.bcard-title{font-size:var(--text-sm);font-weight:var(--w-medium);line-height:1.35;letter-spacing:-.005em;}
.bcard-meta{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap;}
.bhint{font-size:var(--text-xs);color:var(--faint);margin-top:8px;}
.bfind{font-size:var(--text-xs);color:var(--ink-soft);line-height:1.5;margin-top:8px;padding:8px;background:var(--success-bg);border-radius:var(--radius-sm);}
.brun{margin-top:8px;}

/* home / engagements */
.home{min-height:100vh;max-width:1080px;margin:0 auto;padding:var(--s-8) var(--s-6);}
.home-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s-8);}
.home-body{display:grid;grid-template-columns:1fr;gap:var(--s-6);align-items:start;}
@media(min-width:960px){.home-body{grid-template-columns:minmax(0,1.7fr) minmax(240px,1fr);gap:var(--s-7);}}
.home-main{min-width:0;}
.home-h2{font-size:var(--text-xl);font-weight:var(--w-semibold);letter-spacing:-.015em;margin:0 0 var(--s-4);display:flex;align-items:baseline;gap:10px;}
.home-count{font-size:var(--text-base);color:var(--faint);font-weight:var(--w-normal);}
.home-rail{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:var(--s-5);align-self:start;}
.rail-h{font-family:var(--mono);font-size:var(--text-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:var(--s-2);}
.tmpl-empty{font-size:var(--text-sm);color:var(--faint);line-height:1.55;padding:var(--s-4);border:1px dashed var(--line);border-radius:var(--radius-sm);background:var(--surface);}
.home-head-actions{display:flex;align-items:center;gap:10px;}
.agent-count-pill{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:10px;font-family:var(--mono);margin-left:4px;}
/* connected agents */
.ag-intro{margin-bottom:var(--s-6);}
.ag-lede{color:var(--muted);font-size:var(--text-sm);line-height:1.6;max-width:64ch;margin-top:6px;}
.ag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--s-4);}
.ag-card{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:var(--s-4);display:flex;flex-direction:column;gap:8px;}
.ag-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.ag-name{font-weight:var(--w-medium);letter-spacing:-.005em;}
.ag-remove{font-size:var(--text-lg);line-height:1;color:var(--faint);padding:0 4px;border-radius:6px;}
.ag-remove:hover{color:var(--warning);background:var(--surface-2);}
.ag-provider{font-family:var(--mono);font-size:var(--text-xs);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
.ag-scope{display:flex;gap:5px;flex-wrap:wrap;}
.ag-noscope{font-size:var(--text-xs);color:var(--faint);font-style:italic;}
.ag-foot{font-size:var(--text-xs);color:var(--faint);margin-top:2px;}
.eng-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--s-4);}
.eng-card{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);transition:.14s;}
.eng-card:hover{border-color:var(--faint);transform:translateY(-2px);box-shadow:0 8px 24px oklch(20% 0.02 260 / .06);}
.eng-open{display:flex;flex-direction:column;gap:var(--s-2);padding:var(--s-4);cursor:pointer;}
.eng-star{position:absolute;top:10px;right:10px;z-index:2;font-size:var(--text-lg);line-height:1;color:var(--faint);padding:2px 4px;border-radius:6px;transition:.12s;}
.eng-star:hover{color:var(--ink);background:var(--surface-2);}
.eng-star.on{color:var(--warning);}
.eng-client{font-size:var(--text-xs);font-family:var(--mono);letter-spacing:.04em;color:var(--muted);text-transform:uppercase;}
.eng-q{font-size:var(--text-base);font-weight:var(--w-medium);line-height:1.3;letter-spacing:-.01em;color:var(--ink);}
.eng-pips{display:flex;gap:4px;margin-top:var(--s-1);min-height:8px;align-items:center;}
.pip{width:22px;height:6px;border-radius:999px;background:var(--surface-2);}
.pip-question{background:var(--line);}
.pip-approach{background:var(--accent-bg);}
.pip-executing{background:var(--accent);}
.pip-finding{background:var(--success);}
.eng-muted{font-size:var(--text-xs);color:var(--faint);}
.eng-foot{display:flex;align-items:center;gap:8px;font-size:var(--text-xs);color:var(--muted);margin-top:var(--s-2);flex-wrap:wrap;}
.eng-dot{color:var(--faint);}
.eng-when{margin-left:auto;color:var(--faint);}
.home-empty{border:1.5px dashed var(--line);border-radius:var(--radius);padding:var(--s-8);text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:var(--s-4);align-items:center;}
.tmpl-note{font-size:var(--text-sm);color:var(--muted);line-height:1.55;margin:var(--s-3) 0 var(--s-4);max-width:44ch;}
.tmpl-list{display:flex;flex-direction:column;gap:var(--s-2);}
.tmpl-row{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:var(--s-3) var(--s-4);display:flex;flex-direction:column;gap:2px;transition:.12s;}
.tmpl-row:hover{border-color:var(--accent);background:var(--accent-bg);}
.tmpl-title{font-size:var(--text-sm);font-weight:var(--w-medium);line-height:1.3;}
.tmpl-client{font-size:var(--text-xs);color:var(--muted);}
.tmpl-cta{font-size:var(--text-xs);color:var(--accent-ink);margin-top:2px;}
.tmpl-carry{font-size:var(--text-sm);color:var(--accent-ink);background:var(--accent-bg);border-radius:var(--radius-sm);padding:var(--s-3) var(--s-4);margin:0 0 var(--s-4);line-height:1.5;}
/* sidebar engagement switcher */
.eng-switch{display:flex;flex-direction:column;gap:var(--s-2);}
.eng-home-link{text-align:left;font-size:var(--text-sm);color:var(--muted);padding:6px 8px;border-radius:var(--radius-sm);transition:.12s;}
.eng-home-link:hover{background:var(--surface-2);color:var(--ink);}
.eng-select{width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:7px 8px;font:inherit;font-size:var(--text-sm);color:var(--ink);background:var(--surface);cursor:pointer;}
.eng-select:focus{outline:none;border-color:var(--accent);}

/* ---------- deliverable view ---------- */
.dv{min-height:100vh;background:var(--surface-2);}
.dv-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--s-3);padding:var(--s-4) var(--s-5);background:var(--surface);border-bottom:1px solid var(--line);}
.dv-spacer{margin-left:auto;}
.dv-toggle{display:inline-flex;align-items:center;gap:8px;font-size:var(--text-sm);color:var(--ink-soft);cursor:pointer;}
.dv-toggle input{accent-color:var(--accent);width:15px;height:15px;}
.dv-page{max-width:70ch;margin:var(--s-7) auto var(--s-8);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--s-8);}
.dv-kicker{font-family:var(--mono);font-size:var(--text-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.dv-page h1{font-size:var(--text-2xl);letter-spacing:-.02em;line-height:1.12;margin:var(--s-2) 0 var(--s-3);}
.dv-decision{color:var(--ink-soft);font-size:var(--text-lg);margin:0 0 var(--s-5);}
.dv-caveat{font-size:var(--text-sm);color:var(--warning);margin:0 0 var(--s-5);}
.dv-branch{padding:var(--s-6) 0;border-top:1px solid var(--line-soft);}
.dv-branch h2{display:flex;gap:var(--s-3);align-items:baseline;font-size:var(--text-lg);letter-spacing:-.01em;margin:0 0 var(--s-3);}
.dv-branch h2 .n{color:var(--faint);font-variant-numeric:tabular-nums;font-weight:var(--w-normal);}
.dv-rat{margin:var(--s-3) 0;}
.dv-rat .lbl{font-family:var(--mono);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block;margin-bottom:3px;}
.dv-rat p{margin:0;color:var(--ink-soft);font-size:var(--text-sm);line-height:1.6;max-width:65ch;}
.dv-sub{margin:var(--s-3) 0 0;padding-left:var(--s-5);color:var(--ink-soft);font-size:var(--text-sm);}
.dv-sub li{margin:3px 0;}
.dv-finding{margin-top:var(--s-4);padding:var(--s-4);background:var(--success-bg);border-radius:var(--radius-sm);font-size:var(--text-sm);color:var(--ink-soft);line-height:1.55;}
.dv-finding .lbl{display:block;color:var(--success);font-weight:var(--w-semibold);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.dv-by{font-size:var(--text-xs);color:var(--faint);margin-top:var(--s-3);}
.draft-tag{font-size:var(--text-xs);color:var(--warning);background:var(--warning-bg);border-radius:999px;padding:1px 8px;vertical-align:middle;}
.dv-foot{margin-top:var(--s-7);padding-top:var(--s-4);border-top:1px solid var(--line-soft);font-size:var(--text-xs);color:var(--faint);}
.dv-empty{width:min(52ch,90%);margin:var(--s-9) auto;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:var(--s-4);align-items:center;}
.dv-empty h1{font-size:var(--text-xl);color:var(--ink);margin:0;}
.dv-empty p{margin:0;line-height:1.6;}
@media print{
  .dv-bar{display:none;}
  .dv{background:#fff;}
  .dv-page{margin:0;max-width:none;border:none;border-radius:0;padding:0;}
  .dv-branch{break-inside:avoid;}
  .draft-tag{display:none;}
}
.dv-bar .seg{margin:0;}

/* communicate: client update */
.cu-page{max-width:72ch;}
.cu-draftbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s-4);background:var(--accent-bg);border-radius:var(--radius-sm);padding:var(--s-3) var(--s-4);margin-bottom:var(--s-5);font-size:var(--text-sm);color:var(--accent-ink);}
.cu-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
@media print{
  .cu-draftbar,.cu-addrow,.cu-internal,.cu-internal-sec{display:none !important;}
  .cu-page{border:none;box-shadow:none;max-width:none;}
  .dv{background:#fff;}
}
/* client-facing read-only view */
.cv-bar{background:var(--ink);border-color:var(--ink);}
.cv-from{color:var(--bg);font-size:var(--text-sm);font-weight:var(--w-medium);}
.cv-bar .btn{background:transparent;color:var(--bg);border-color:oklch(100% 0 0 / .28);}
.cv-bar .btn:hover{border-color:oklch(100% 0 0 / .55);}
.cv-branch h2{align-items:center;}
.cv-status.done{background:var(--success-bg);color:var(--success);}
.cv-status.prog{background:var(--accent-bg);color:var(--accent-ink);}
.cv-status.plan{background:var(--surface-2);color:var(--muted);}
.cv-react{margin-top:var(--s-6);padding-top:var(--s-5);border-top:1px solid var(--line-soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.cv-react span{font-size:var(--text-sm);color:var(--muted);margin-right:auto;}

/* Present: editable deck */
.pz{min-height:100vh;display:flex;flex-direction:column;background:var(--surface-2);}
.pz-title{font-family:var(--mono);font-size:var(--text-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.pz-saved{font-size:var(--text-xs);color:var(--success);}
.pz-stage-wrap{flex:1;display:flex;align-items:center;justify-content:center;gap:var(--s-4);padding:var(--s-6) var(--s-4);min-height:0;}
.pz-nav{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:var(--text-xl);color:var(--ink);display:grid;place-items:center;flex:none;transition:.12s;}
.pz-nav:hover:not(:disabled){border-color:var(--faint);}
.pz-nav:disabled{opacity:.3;cursor:not-allowed;}
.pz-stage{width:min(880px,100%);aspect-ratio:16/9;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 12px 40px oklch(20% 0.02 260 / .1);overflow:hidden;}
.slide{width:100%;height:100%;display:flex;flex-direction:column;padding:clamp(24px,4vw,52px);}
.slide-title{justify-content:center;gap:var(--s-4);}
.slide-brand{font-family:var(--mono);font-size:var(--text-xs);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.slide-h1{font-size:clamp(1.6rem,3.4vw,2.6rem);font-weight:var(--w-semibold);letter-spacing:-.02em;line-height:1.1;margin:0;color:var(--ink);}
.slide-sub{font-size:clamp(0.95rem,1.6vw,1.25rem);color:var(--ink-soft);}
.slide-eyebrow{font-family:var(--mono);font-size:var(--text-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:var(--s-3);}
.slide-h2{font-size:clamp(1.25rem,2.4vw,1.9rem);font-weight:var(--w-semibold);letter-spacing:-.015em;line-height:1.15;margin:0 0 var(--s-5);color:var(--ink);}
.slide-bullets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s-3);flex:1;}
.slide-bullets li{display:flex;gap:12px;align-items:flex-start;}
.slide-bullets li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:9px;flex:none;}
.slide-bullet{font-size:clamp(0.95rem,1.5vw,1.2rem);line-height:1.5;color:var(--ink-soft);flex:1;}
[contenteditable]{outline:none;border-radius:4px;transition:background .12s;}
[contenteditable]:hover{background:var(--surface-2);}
[contenteditable]:focus{background:var(--accent-bg);box-shadow:0 0 0 2px var(--accent-bg);}
.slide-delb{opacity:0;border:none;background:none;color:var(--muted);font-size:var(--text-lg);line-height:1;cursor:pointer;padding:0 4px;}
.slide-bullets li:hover .slide-delb{opacity:1;}
.slide-delb:hover{color:var(--warning);}
.slide-addb{align-self:flex-start;font-size:var(--text-xs);color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:4px 10px;margin-top:var(--s-3);}
.slide-addb:hover{border-color:var(--accent);color:var(--accent-ink);}
.slide-foot{font-family:var(--mono);font-size:var(--text-xs);color:var(--faint);margin-top:var(--s-4);}
.pz-rail{display:flex;gap:var(--s-2);padding:var(--s-3) var(--s-4);overflow-x:auto;border-top:1px solid var(--line);background:var(--surface);}
.pz-thumb{flex:none;width:150px;text-align:left;border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;gap:3px;transition:.12s;}
.pz-thumb:hover{border-color:var(--faint);}
.pz-thumb.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg);}
.pz-thumb-n{font-family:var(--mono);font-size:var(--text-xs);color:var(--faint);}
.pz-thumb-t{font-size:var(--text-xs);color:var(--ink-soft);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pz-print{display:none;}
@media print{
  .pz-stage-wrap,.pz-rail,.dv-bar{display:none;}
  .pz{background:#fff;}
  .pz-print{display:block;}
  .pz-print-slide{break-after:page;padding:0;}
  .pz-print-slide .slide{height:auto;min-height:80vh;border:1px solid var(--line);border-radius:var(--radius);}
  .slide-delb,.slide-addb{display:none;}
}
.cu-meta{font-size:var(--text-sm);color:var(--muted);margin:0 0 var(--s-5);}
.cu-goal{font-size:var(--text-lg);color:var(--ink-soft);margin:0 0 var(--s-4);line-height:1.4;}
.cu-goal b{color:var(--ink);font-weight:var(--w-medium);}
.cu-progress{margin:0 0 var(--s-4);}
.cu-progress-bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;}
.cu-progress-bar > i{display:block;height:100%;background:var(--success);border-radius:999px;transition:width .4s;}
.cu-progress-txt{display:block;font-size:var(--text-sm);color:var(--muted);margin-top:6px;}
.cu-headline{background:var(--surface-2);border-radius:var(--radius-sm);padding:var(--s-4) var(--s-5);margin-bottom:var(--s-6);}
.cu-headline p{margin:0 0 var(--s-2);line-height:1.6;color:var(--ink);} .cu-headline p:last-child{margin:0;color:var(--ink-soft);font-size:var(--text-sm);}
.cu-sec{margin-top:var(--s-6);}
.cu-sec-h{font-size:var(--text-xs);font-weight:var(--w-semibold);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:var(--s-3);}
.cu-branch{padding:var(--s-3) 0;border-top:1px solid var(--line-soft);}
.cu-branch:first-of-type{border-top:none;}
.cu-branch.cu-new{background:linear-gradient(90deg, var(--accent-bg), transparent 60%);border-radius:var(--radius-sm);padding-left:var(--s-3);}
.cu-branch-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.cu-branch-title{font-weight:var(--w-medium);}
.cu-branch-meta{display:flex;align-items:center;gap:6px;margin-top:6px;}
.cu-tag{font-size:var(--text-xs);color:var(--accent-ink);background:var(--surface);border:1px solid var(--accent);border-radius:999px;padding:1px 8px;}
.cu-finding{margin:6px 0 0;font-size:var(--text-sm);color:var(--ink-soft);line-height:1.55;}
.cu-note{font-size:var(--text-sm);color:var(--muted);margin:0 0 var(--s-3);}
.cu-req{display:flex;justify-content:space-between;gap:var(--s-3);padding:8px 0;border-top:1px solid var(--line-soft);font-size:var(--text-sm);}
.cu-req-when{color:var(--faint);font-size:var(--text-xs);white-space:nowrap;}
.cu-empty-row{font-size:var(--text-sm);color:var(--faint);padding:6px 0;}
.cu-addrow{display:flex;gap:8px;margin-top:var(--s-3);}
.cu-addrow input{flex:1;border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;font:inherit;font-size:var(--text-sm);background:var(--surface);}
.cu-addrow input:focus{outline:none;border-color:var(--accent);}
.cu-react{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:var(--text-sm);color:var(--ink-soft);}
.cu-react-kind{font-size:var(--text-xs);padding:2px 8px;border-radius:999px;white-space:nowrap;}
.cu-react-kind.aligned{background:var(--success-bg);color:var(--success);}
.cu-react-kind.question{background:var(--warning-bg);color:var(--warning);}
/* teammate brief */
.tb-sec{margin-top:var(--s-6);}
.tb-standing{font-size:var(--text-sm);color:var(--ink-soft);margin:0;line-height:1.6;}
.tb-row{padding:var(--s-3) 0;border-top:1px solid var(--line-soft);}
.tb-row:first-of-type{border-top:none;}
.tb-row-title{font-weight:var(--w-medium);}
.tb-why{margin:6px 0;font-size:var(--text-sm);color:var(--ink-soft);line-height:1.55;}
.tb-why .lbl,.tb-open .tb-under{font-family:var(--mono);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
.tb-row-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.tb-has-finding{font-size:var(--text-xs);color:var(--success);}
.tb-live{display:flex;justify-content:space-between;gap:var(--s-3);padding:8px 0;border-top:1px solid var(--line-soft);font-size:var(--text-sm);}
.tb-owner{color:var(--muted);font-size:var(--text-xs);white-space:nowrap;}
.tb-open{padding:6px 0;font-size:var(--text-sm);color:var(--ink-soft);}
.tb-caveat{font-size:var(--text-sm);color:var(--ink-soft);background:var(--warning-bg);border-radius:var(--radius-sm);padding:var(--s-3) var(--s-4);margin:0;line-height:1.55;}

/* coaching thread (the grilling) */
.thread{display:flex;flex-direction:column;gap:var(--s-3);}
.th-item{background:var(--surface-2);border-radius:var(--radius-sm);padding:var(--s-3);}
.th-q{font-size:var(--text-sm);font-weight:var(--w-medium);color:var(--ink);line-height:1.45;}
.th-a{font-size:var(--text-sm);color:var(--ink-soft);margin-top:6px;line-height:1.5;}
.th-foot{margin-top:8px;}
.th-type{font-size:var(--text-xs);padding:2px 8px;border-radius:999px;text-transform:capitalize;}
.th-type.confirmed{background:var(--success-bg);color:var(--success);}
.th-type.assumption{background:var(--warning-bg);color:oklch(48% 0.1 60);}
.th-type.hypothesis{background:var(--accent-bg);color:var(--accent-ink);}
.th-follow{margin-top:8px;font-size:var(--text-sm);color:var(--accent-ink);line-height:1.5;}
.th-open{border:1px solid var(--line);border-radius:var(--radius-sm);padding:var(--s-3);}
.th-open .th-q{margin-bottom:8px;}
.th-hint{font-size:var(--text-xs);color:var(--muted);margin:8px 0;line-height:1.5;}
.th-typepick{display:flex;gap:6px;flex-wrap:wrap;}
.th-typebtn{font-size:var(--text-xs);padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft);transition:.12s;}
.th-typebtn.confirmed:hover{background:var(--success-bg);color:var(--success);border-color:transparent;}
.th-typebtn.assumption:hover{background:var(--warning-bg);color:oklch(48% 0.1 60);border-color:transparent;}
.th-typebtn.hypothesis:hover{background:var(--accent-bg);color:var(--accent-ink);border-color:transparent;}
.th-done{font-size:var(--text-sm);color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);padding:var(--s-2) 0;}
.th-ask{display:flex;align-items:center;gap:var(--s-3);}
.th-ask-note{font-size:var(--text-xs);color:var(--faint);}
.th-open-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.th-live{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:var(--text-xs);letter-spacing:.04em;color:var(--accent-ink);}
.th-pause{font-size:var(--text-xs);color:var(--muted);padding:2px 8px;border-radius:999px;}
.th-pause:hover{background:var(--surface-2);color:var(--ink);}
.cu-confirmed{margin:8px 0 0;padding-left:18px;font-size:var(--text-sm);color:var(--ink-soft);line-height:1.5;}
.cu-confirmed li{margin:2px 0;}
.cu-internal{font-size:var(--text-xs);color:var(--muted);margin:6px 0 0;font-style:italic;}

.toast{position:fixed;bottom:var(--s-6);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:var(--text-sm);opacity:0;transition:.2s;pointer-events:none;z-index:60;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   State
   ============================================================ */
const MODELS = [
  {id:"opus", name:"Claude Opus 4.8", live:true},
  {id:"gpt", name:"GPT-5.1", live:true},
  {id:"gemini", name:"Gemini 3 Pro", live:true},
  {id:"none", name:"No model (I'll author manually)", live:false},
];
const PHASES = [
  {id:"question", label:"Open"},
  {id:"approach", label:"Framed"},
  {id:"executing", label:"Running"},
  {id:"finding", label:"Answered"},
];

/* The 4 typed analysis frameworks, restored from the original Strenaysis.
   A new engagement is seeded from the framework that best fits the question,
   then the canvas stays fully flexible (edit / add / reorder / delete). */
const NODE_WHY = {
  "Objective":"Defines the business question precisely so the analysis solves the right problem.",
  "Metric":"Defines success and guardrails so every later trade-off stays grounded.",
  "Segmentation":"Shows where to cut the problem so the analysis is comparable and decision-useful.",
  "Drivers":"Identifies the key levers and hypotheses that most likely explain the outcome.",
  "Data":"Clarifies what evidence exists, what is missing, and what can credibly answer the question.",
  "Model":"Chooses the analytical engine that best supports prediction, ranking, or prioritization.",
  "Decision":"Translates the analysis into a concrete business action, threshold, or targeting rule.",
  "Result":"Summarizes the expected or observed performance so the recommendation is evidence-backed.",
  "Takeaway":"Packages the final message into the clearest recommendation, caveats, and next steps.",
  "Hypotheses":"Frames the causal stories worth testing before jumping into intervention design.",
  "Experiment Design":"Specifies how to estimate causal impact cleanly and credibly.",
  "Constraints":"Makes the real-world limits explicit so the framework stays actionable.",
  "Impact":"Sizes the business upside and trade-offs so action can be prioritized rationally.",
};
const FRAMEWORKS = {
  predictive_modeling:      { label:"Predictive Modeling",       stages:["Objective","Metric","Drivers","Data","Model","Decision","Result","Takeaway"] },
  descriptive_analysis:     { label:"Descriptive Analysis",      stages:["Objective","Metric","Segmentation","Drivers","Data","Result","Takeaway"] },
  experiment_causal:        { label:"Experiment / Causal",       stages:["Objective","Metric","Hypotheses","Data","Experiment Design","Decision","Result","Takeaway"] },
  operational_optimization: { label:"Operational Optimization",  stages:["Objective","Metric","Constraints","Drivers","Data","Decision","Impact","Takeaway"] },
};
const FRAMEWORK_ORDER = ["predictive_modeling","descriptive_analysis","experiment_causal","operational_optimization"];
function classifyFramework(q, ctx){
  const t = ((q||"") + " " + ((ctx&&ctx.decision)||"")).toLowerCase();
  if(/\b(test|experiment|causal|a\/b|randomi|treatment|impact of|does .* cause|cannibali)\b/.test(t)) return "experiment_causal";
  if(/\b(optimi|reduce|minimi|maximi|efficien|allocat|schedul|throughput|no-show|utili)\b/.test(t)) return "operational_optimization";
  if(/\b(predict|forecast|churn|propensity|likelihood|score|classif|will .* happen)\b/.test(t)) return "predictive_modeling";
  if(/\b(describe|understand|explore|profile|segment|what happened|why did|trend|drivers of)\b/.test(t)) return "descriptive_analysis";
  return "predictive_modeling";
}
function proposeFromFramework(fwId, q, ctx){
  const fw = FRAMEWORKS[fwId] || FRAMEWORKS.predictive_modeling;
  const rootId = nid();
  const nodes = {}; const order = [];
  nodes[rootId] = mkNode(rootId, q, "question", "human", true, []);
  fw.stages.forEach(stage=>{
    const id = nid();
    nodes[id] = mkNode(id, stage, "approach", "ai", false, [], { why: NODE_WHY[stage] || "", order:"", mece:"" });
    order.push(id);
  });
  return { rootId, nodes, order };
}

const state = {
  view: "home",            // home | intake | interrogate | canvas | deliverable
  engagements: {},         // id -> engagement
  engOrder: [],            // engagement ids, display order
  activeId: null,          // active engagement
  filter: "tree",          // tree (reasoning map) | board (status by phase)
  dvIncludeDrafts: false,  // deliverable: show un-accepted (draft) branches
  membrane: "client",      // communicate view: client | teammate
  _templateFrom: null,     // when creating from an existing engagement
  // Connected agents: global, reusable across every engagement, separate from
  // the engagement's own reasoning model (which powers decomposition/pressure-test).
  // This is the roster you dispatch NODE EXECUTION to, mirroring monday.com's
  // "Bring Your Own Agent" (provider + auth + scope) and Notion's per-agent MCP tools.
  connectedAgents: {},      // id -> {id, name, provider, scope:[connector,...], connectedAt}
  agentOrder: [],
  _connectDraft: null,      // in-progress connect-agent form state
};

const AGENT_PROVIDERS = [
  {id:"anthropic", name:"Anthropic"},
  {id:"openai", name:"OpenAI"},
  {id:"google", name:"Google"},
  {id:"bedrock", name:"Amazon Bedrock"},
  {id:"azure", name:"Azure AI Foundry"},
];
const CONNECTOR_OPTIONS = ["BigQuery","Hex","Definite","Snowflake","Google Sheets"];
let agentSeq = 0;
function newAgentObj(over){
  return Object.assign({ id:"ag"+(++agentSeq), name:"", provider:"anthropic", scope:[], connectedAt:Date.now() }, over||{});
}
function connectedAgentList(){ return state.agentOrder.map(id=>state.connectedAgents[id]); }

// The active engagement holds all canvas state. Proxy the familiar fields
// onto `state` so every render/mutation function keeps working unchanged.
["question","model","ctx","nodes","order","rootId","selected","framework"].forEach(k=>{
  Object.defineProperty(state, k, {
    get(){ const e = state.engagements[state.activeId]; return e ? e[k] : undefined; },
    set(v){ const e = state.engagements[state.activeId]; if(e){ e[k] = v; e.updatedAt = Date.now(); } },
  });
});

let uid = 0;
const nid = () => "n" + (++uid);
let engSeq = 0;

function newEngagementObj(over){
  return Object.assign({
    id: "e" + (++engSeq),
    question: "", model: "opus", ctx: {client:"", decision:"", data:""},
    framework: "predictive_modeling",
    nodes: {}, order: [], rootId: null, selected: null,
    published: null,        // { at, states:{nodeId:phase} } snapshot for the client-update diff
    requests: [],           // scope asks that landed outside the tree
    reactions: [],          // client reactions captured back onto the engagement
    savedAsTemplate: false, // explicitly saved for reuse across clients
    deck: null,             // Present deck (editable slides), lazily built from node state
    createdAt: Date.now(), updatedAt: Date.now(),
  }, over || {});
}

/* ============================================================
   Mock "LLM": interrogation-aware MECE decomposition.
   Interpolates the consultant's context so the tree feels
   specific, not templated. The #1 risk we flagged.
   ============================================================ */
function proposeDecomposition(q, ctx){
  const client = ctx.client?.trim() || "the client";
  const decision = ctx.decision?.trim() || "the decision this analysis feeds";
  const data = ctx.data?.trim() || "the available data";

  const branches = [
    {
      title:`Demand & customer signal: is this driven by what customers actually do?`,
      why:`Before ${client} commits resources, we isolate whether the demand is real. This line owns the behavioural evidence: cohorts, usage, willingness-to-pay.`,
      order:`First, because it is the cheapest to falsify. If the demand signal isn't there, the economics and execution branches are moot, and we save ${client} weeks.`,
      mece:`Mutually exclusive from the economics line: this measures whether customers want it, not whether it pays. Draws on ${data}.`,
      children:[
        {title:`Segment the movement: which cohorts move, which are flat?`, why:`Aggregate numbers hide the story. Splitting by cohort shows ${client} where the effect is real.`},
        {title:`Willingness-to-pay / intent evidence`, why:`Separates stated interest from revealed behaviour.`},
      ],
    },
    {
      title:`Unit economics: does it pay for itself at scale?`,
      why:`Even with strong demand, ${decision} only makes sense if the economics hold. This line owns cost-to-serve, margin, and payback.`,
      order:`Second: only worth modelling once demand (line 1) is plausible. It depends on line 1's cohort split to weight the economics.`,
      mece:`Exclusive from demand: this is the money question, not the want question. Together with line 1 it covers "should we?" before "can we?".`,
      children:[
        {title:`Cost-to-serve model`, why:`Ties ${data} to a per-unit cost so the margin is defensible.`},
      ],
    },
    {
      title:`Feasibility & execution risk: can the team actually deliver it?`,
      why:`The "can we?" question: capability, dependencies, and what breaks. This line owns the operational and data-readiness risks.`,
      order:`Third: it only matters once "should we?" (lines 1–2) looks positive. Ordered last so we don't over-invest in de-risking a bad idea.`,
      mece:`Exhaustive check: lines 1–2 decide whether the idea is right; this decides whether ${client} can execute it. Together they close the loop for ${decision}.`,
      children:[],
    },
  ];

  const rootId = nid();
  const nodes = {};
  nodes[rootId] = mkNode(rootId, q, "question", "human", true, []);
  const order = [];
  branches.forEach(b=>{
    const id = nid();
    const childIds = (b.children||[]).map(c=>{
      const cid = nid();
      nodes[cid] = mkNode(cid, c.title, "question", "ai", false, [], {why:c.why, order:"", mece:""});
      return cid;
    });
    nodes[id] = mkNode(id, b.title, "approach", "ai", false, childIds, {why:b.why, order:b.order, mece:b.mece});
    order.push(id);
  });
  return {rootId, nodes, order};
}

function mkNode(id, title, phase, prov, accepted, children, rationale){
  return {id, title, phase, prov, accepted, children:children||[],
    rationale: rationale || {why:"", order:"", mece:""}, progress:0, finding:"",
    thread: [], agentId: null};  // agentId: which connected agent (state.connectedAgents) runs this node, if any
}

/* The grilling: ADAPTIVE probing, one question at a time, chosen from the node,
   the engagement context, and the consultant's LAST answer/tag (not a fixed queue).
   Mock stand-in for the LLM's coaching loop. */
const GRILL_NAME = "Pressure test";  // section label for the coaching thread (easy to swap)
const GRILL_CAP = 6;            // auto-surface questions until this many are captured
function shortTitle(t){ return (String(t).split(":")[0] || String(t)).trim().slice(0,52); }
function shortData(e){ return ((e && e.ctx.data) || "the data").split(";")[0].trim().slice(0,40); }
const GRILL = {
  opening: [
    (n,e)=>`What would have to be true for "${shortTitle(n.title)}" to be worth investigating at all?`,
    (n,e)=>`What's your current best answer here, and how confident are you, honestly?`,
  ],
  afterAssumption: [
    (n,e)=>`You flagged that as an assumption. What's the cheapest way to test it before you rely on it?`,
    (n,e)=>`What would you have to see in ${shortData(e)} to stop believing that?`,
  ],
  afterHypothesis: [
    (n,e)=>`Name the experiment that would confirm or kill that hypothesis.`,
    (n,e)=>`If that hypothesis is wrong, what's the earliest signal you'd notice?`,
  ],
  afterConfirmed: [
    (n,e)=>`Confirmed how? What's the source you'd defend to ${(e && e.ctx.client) || "the client"}?`,
    (n,e)=>`Given that's solid, what does confirming it let you rule out?`,
  ],
  deep: [
    (n,e)=>`What are you assuming about ${shortData(e)} that you haven't verified?`,
    (n,e)=>`If this whole line turns out to be a dead end, what's the earliest signal you'd see?`,
    (n,e)=>`Whose perspective on "${shortTitle(n.title)}" are you missing?`,
  ],
};
function nextGrillQuestion(n, e){
  const asked = new Set((n.thread||[]).map(x=>x.q));
  let pool;
  if(!n.thread.length){ pool = GRILL.opening; }
  else {
    const last = n.thread[n.thread.length-1];
    pool = last.type==="assumption" ? GRILL.afterAssumption
         : last.type==="hypothesis" ? GRILL.afterHypothesis
         : GRILL.afterConfirmed;
    if(n.thread.length>=2 && Math.random()<0.45) pool = GRILL.deep;   // occasionally zoom out
  }
  for(const tpl of pool){ const q = tpl(n,e); if(!asked.has(q)) return q; }
  for(const tpl of GRILL.deep){ const q = tpl(n,e); if(!asked.has(q)) return q; }
  return "What's the one thing about this you're least sure of?";
}
function grillFollowup(type){
  if(type==="confirmed") return "Solid footing. What does confirming this let you rule out?";
  if(type==="hypothesis") return "A hypothesis. Name the experiment that would confirm or kill it.";
  return "That's an assumption, not a fact yet. What's the cheapest way to test it before you rely on it?";
}
function threadStats(n){
  const t = n.thread || [];
  return {
    confirmed: t.filter(x=>x.type==="confirmed"),
    assumption: t.filter(x=>x.type==="assumption"),
    hypothesis: t.filter(x=>x.type==="hypothesis"),
  };
}

/* ============================================================
   Render
   ============================================================ */
const root = document.getElementById("root");

// Preserve scroll across re-renders. The tree/board (.canvas) should never jump;
// the node panel (.panel-body) keeps its scroll while the same node stays selected,
// and resets to top when a different node is selected.
const scrollMem = { canvas:0, panel:0, panelNode:null };
function bindScroll(){
  const c = document.querySelector('.canvas');
  if(c){ c.scrollTop = scrollMem.canvas; c.onscroll = ()=>{ scrollMem.canvas = c.scrollTop; }; }
  const pb = document.querySelector('.panel-body');
  if(pb){
    if(scrollMem.panelNode !== state.selected){ scrollMem.panel = 0; scrollMem.panelNode = state.selected; }
    pb.scrollTop = scrollMem.panel;
    pb.onscroll = ()=>{ scrollMem.panel = pb.scrollTop; };
  }
}
function resetScrollMem(){ scrollMem.canvas = 0; scrollMem.panel = 0; scrollMem.panelNode = null; }

function render(){
  if(state.view === "home") return renderHome();
  if(state.view === "intake") return renderIntake();
  if(state.view === "interrogate") return renderInterrogate();
  if(state.view === "present") return renderPresent();
  if(state.view === "communicate") return renderCommunicate();
  if(state.view === "clientview") return renderClientView();
  if(state.view === "agents") return renderAgents();
  if(state.view === "connect-agent") return renderConnectAgent();
  return renderCanvas();
}

/* ============================================================
   Engagements: home, lifecycle, templates
   ============================================================ */
function engStats(e){
  const total = e.order.length;
  const accepted = e.order.filter(id=>e.nodes[id].accepted).length;
  const mix = {question:0, approach:0, executing:0, finding:0};
  e.order.forEach(id=>{ mix[e.nodes[id].phase]++; e.nodes[id].children.forEach(cid=>{ /* branches only in mix */ }); });
  return {total, accepted, mix};
}
function relTime(ts){
  const d = Date.now()-ts, m=Math.round(d/60000), h=Math.round(d/3600000), day=Math.round(d/86400000);
  if(m<1) return "just now"; if(m<60) return m+"m ago"; if(h<24) return h+"h ago"; return day+"d ago";
}
function startEngagement(fromId){
  const src = fromId ? state.engagements[fromId] : null;
  const e = newEngagementObj(src ? {question:src.question, model:src.model, ctx:{...src.ctx}} : {});
  state.engagements[e.id] = e;
  state.engOrder.unshift(e.id);
  state.activeId = e.id;
  state._templateFrom = fromId || null;
  state.view = "intake";
  render();
}
function cancelDraftEngagement(){
  // if the in-progress engagement has no tree yet, discard it
  const e = state.engagements[state.activeId];
  if(e && e.order.length===0){ delete state.engagements[e.id]; state.engOrder = state.engOrder.filter(id=>id!==e.id); }
  state.activeId = null; state._templateFrom = null; state.view = "home"; render();
}
function openEngagement(id){ state.activeId = id; state.view = "canvas"; resetScrollMem(); render(); }
function goHome(){ state.activeId = null; state.view = "home"; render(); }

// Clone an existing engagement's structure into the active one, reset so the
// consultant must re-accept every branch for the new client.
function cloneTreeInto(t, s){
  const nodes = {};
  const rootId = nid();
  nodes[rootId] = mkNode(rootId, t.question || s.question, "question", "human", true, []);
  const order = [];
  s.order.forEach(bid=>{
    const b = s.nodes[bid];
    const childIds = b.children.map(cid=>{
      const c = s.nodes[cid]; const ncid = nid();
      nodes[ncid] = mkNode(ncid, c.title, "question", "ai", false, [], {...c.rationale});
      return ncid;
    });
    const nbid = nid();
    nodes[nbid] = mkNode(nbid, b.title, "approach", "ai", false, childIds, {...b.rationale});
    order.push(nbid);
  });
  t.nodes = nodes; t.order = order; t.rootId = rootId; t.selected = order[0];
}

function renderHome(){
  const cards = state.engOrder.map(id=>{
    const e = state.engagements[id]; const s = engStats(e);
    const m = MODELS.find(x=>x.id===e.model);
    const pips = e.order.map(bid=>`<span class="pip pip-${e.nodes[bid].phase}" title="${PHASES.find(p=>p.id===e.nodes[bid].phase).label}"></span>`).join("");
    return `<div class="eng-card" data-id="${id}">
      <button class="eng-star ${e.savedAsTemplate?"on":""}" data-star="${id}" title="${e.savedAsTemplate?"Saved as template (click to remove)":"Save as template"}">${e.savedAsTemplate?"★":"☆"}</button>
      <div class="eng-open" data-open="${id}">
        <div class="eng-client">${esc(e.ctx.client || "Untitled client")}</div>
        <div class="eng-q">${esc(e.question || "Untitled question")}</div>
        <div class="eng-pips">${pips || `<span class="eng-muted">no nodes yet</span>`}</div>
        <div class="eng-foot">
          ${s.total ? `<span class="own ${s.accepted===s.total?"own-yours":"own-draft"}">${s.accepted}/${s.total} yours</span>` : ""}
          <span class="eng-dot">·</span><span>${m ? esc(m.id==="none" ? "Manual (no model)" : m.name) : ""}</span>
          <span class="eng-when">${relTime(e.updatedAt)}</span>
        </div>
      </div>
    </div>`;
  }).join("");

  const tmplIds = state.engOrder.filter(id=>state.engagements[id].savedAsTemplate && state.engagements[id].order.length>0);
  const templates = tmplIds.map(id=>{
    const e = state.engagements[id];
    return `<button class="tmpl-row" data-tmpl="${id}">
      <span class="tmpl-title">${esc(e.question || "Untitled")}</span>
      <span class="tmpl-client">${esc(e.ctx.client||"")}</span>
      <span class="tmpl-cta">Reuse structure →</span>
    </button>`;
  }).join("");

  root.innerHTML = `
    <div class="home">
      <header class="home-head">
        <div class="brand"><div class="brand-glyph">S</div><div><div class="brand-name">Strenaysis</div><div class="brand-sub">Reasoning canvas</div></div></div>
        <div class="home-head-actions">
          <button class="btn btn-sm" id="to-agents">⚙ Agents <span class="agent-count-pill">${state.agentOrder.length}</span></button>
          <button class="btn btn-primary" id="new-eng">+ New engagement</button>
        </div>
      </header>
      <div class="home-body">
        <div class="home-main">
          <h2 class="home-h2">Active engagements <span class="home-count">${state.engOrder.length}</span></h2>
          ${state.engOrder.length ? `<div class="eng-grid">${cards}</div>`
            : `<div class="home-empty"><p>No engagements yet.</p><button class="btn btn-accent" id="new-eng-2">Start your first engagement</button></div>`}
        </div>
        <aside class="home-rail">
          <div class="rail-h">Templates</div>
          <p class="tmpl-note">Save an engagement as a template with the <b>☆</b> on its card, then start new client work from it. The tree carries over and you re-accept each node.</p>
          ${templates ? `<div class="tmpl-list">${templates}</div>`
            : `<div class="tmpl-empty">No templates yet. Tap <b>☆</b> on any engagement to save its structure for reuse.</div>`}
        </aside>
      </div>
    </div>`;

  const nw = document.getElementById("new-eng"); if(nw) nw.onclick = ()=>startEngagement(null);
  const nw2 = document.getElementById("new-eng-2"); if(nw2) nw2.onclick = ()=>startEngagement(null);
  document.getElementById("to-agents").onclick = ()=>{ state.view="agents"; render(); };
  root.querySelectorAll("[data-open]").forEach(el=> el.onclick = ()=>openEngagement(el.dataset.open));
  root.querySelectorAll("[data-tmpl]").forEach(el=> el.onclick = ()=>startEngagement(el.dataset.tmpl));
  root.querySelectorAll("[data-star]").forEach(el=> el.onclick = (ev)=>{
    ev.stopPropagation();
    const en = state.engagements[el.dataset.star]; en.savedAsTemplate = !en.savedAsTemplate;
    toast(en.savedAsTemplate ? "Saved as template" : "Removed from templates");
    renderHome();
  });
}

/* ============================================================
   Connected agents: global roster, reusable across every
   engagement. Separate from the engagement's reasoning model.
   Mirrors monday.com "Bring Your Own Agent" (provider + auth +
   named agent) and Notion Custom Agents (per-agent tool scope).
   ============================================================ */
function agentUsageCount(id){
  let n = 0;
  Object.values(state.engagements).forEach(e=> Object.values(e.nodes||{}).forEach(nd=>{ if(nd.agentId===id) n++; }));
  return n;
}
function agentCardHtml(a){
  const uses = agentUsageCount(a.id);
  return `<div class="ag-card">
    <div class="ag-card-top">
      <div class="ag-name">${esc(a.name)}</div>
      <button class="ag-remove" data-remove-agent="${a.id}" title="Disconnect">×</button>
    </div>
    <div class="ag-provider">${esc((AGENT_PROVIDERS.find(p=>p.id===a.provider)||{}).name || a.provider)}</div>
    <div class="ag-scope">${a.scope.length ? a.scope.map(s=>`<span class="chip">${esc(s)}</span>`).join("") : `<span class="ag-noscope">no data access configured</span>`}</div>
    <div class="ag-foot">Connected ${relTime(a.connectedAt)}${uses?` · running on ${uses} node${uses===1?"":"s"}`:""}</div>
  </div>`;
}
function renderAgents(){
  const list = connectedAgentList();
  root.innerHTML = `
    <div class="home">
      <header class="home-head">
        <button class="btn btn-sm" id="ag-back">← Home</button>
        <button class="btn btn-primary" id="ag-connect">+ Connect an agent</button>
      </header>
      <div class="ag-intro">
        <h2 class="home-h2">Connected agents</h2>
        <p class="ag-lede">Agents you dispatch node execution to. Connect once, use across every engagement. Each agent is scoped to the data and tools it's allowed to touch, so a node only reaches what its agent is connected to.</p>
      </div>
      ${list.length ? `<div class="ag-grid">${list.map(agentCardHtml).join("")}</div>`
        : `<div class="home-empty"><p>No agents connected yet. Nodes set to "Agent" execution have nothing to dispatch to until you connect one.</p><button class="btn btn-accent" id="ag-connect-2">Connect your first agent</button></div>`}
    </div>`;
  document.getElementById("ag-back").onclick = ()=>{ state.view="home"; render(); };
  const c1=document.getElementById("ag-connect"); if(c1) c1.onclick = ()=>{ state._connectDraft=null; state.view="connect-agent"; render(); };
  const c2=document.getElementById("ag-connect-2"); if(c2) c2.onclick = ()=>{ state._connectDraft=null; state.view="connect-agent"; render(); };
  root.querySelectorAll("[data-remove-agent]").forEach(el=> el.onclick = ()=>{
    const id = el.dataset.removeAgent;
    const uses = agentUsageCount(id);
    if(uses && !confirm(`${uses} node${uses===1?" runs":"s run"} on this agent. Disconnect anyway?`)) return;
    delete state.connectedAgents[id]; state.agentOrder = state.agentOrder.filter(x=>x!==id);
    toast("Agent disconnected"); renderAgents();
  });
}

function renderConnectAgent(){
  const d = state._connectDraft || (state._connectDraft = { provider:"anthropic", name:"", key:"", scope:[] });
  root.innerHTML = `
    <div class="stage"><div class="stage-card">
      <button class="btn btn-ghost btn-sm" id="ca-back" style="margin-bottom:var(--s-5)">← Agents</button>
      <div class="kicker">Connect an agent</div>
      <h1>Bring your own agent.</h1>
      <p class="lede">Authenticate a provider, then scope what this agent can touch. It becomes reusable across every engagement.</p>

      <div class="q-block">
        <label>Provider</label>
        <div class="hint">Who hosts this agent.</div>
        <div class="fw-picker" id="ca-provider">
          ${AGENT_PROVIDERS.map(p=>`<button class="fw-opt ${d.provider===p.id?"on":""}" data-p="${p.id}">${p.name}</button>`).join("")}
        </div>
